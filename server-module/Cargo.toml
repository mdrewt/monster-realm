[package]
name = "monster-realm-module"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# cdylib: the SpacetimeDB module (wasm) artifact; rlib lets the pure helpers be
# unit-tested off-instance.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The pure rule layer (SSOT). The server runs the SAME code the client predicts
# with; the `spacetimedb` feature enables game-core's SpacetimeType derives (M6).
game-core = { path = "../game-core", features = ["spacetimedb"] }
# SpacetimeDB module SDK. Version rationale + the 1.x/2.x correction live on the
# workspace pin in ../Cargo.toml (ADR-0197). Short version: crate 2.8.1, kept in
# lockstep with the CLI/host — the crate version IS the product version. Write
# 2.x syntax; the three changed spellings are in .claude/skills/spacetimedb-reducer.
spacetimedb = { workspace = true }
# Structured logging facade (captured by the SpacetimeDB host).
log.workspace = true
# NFC canonicalization for player/monster names (#27c, guards::validate_name).
unicode-normalization = { workspace = true }

[dev-dependencies]
# Property testing for the evaluate_train seam (M9b-tail, raising_tests.rs).
proptest = { workspace = true }

[features]
# Dev/test-only reducers (start_wild_battle, grant_bait), OFF in release/publish
# (ADR-0054). Enabled for the recruit e2e via a pre-built wasm + `spacetime
# publish --bin-path` (ADR-0086). NOTE (ADR-0197): ADR-0054's premise that "no
# CLI feature passthrough exists" is wrong — `spacetime build --features` DOES
# exist (v1.11.0 through v2.8.1) but is `.hide(true)`, so it never shows in
# `--help`, which is how it was missed. The `--bin-path` route still works and is
# arguably more stable (the vendor has a TODO to rename the flag), so this is a
# recorded correction, not a mandate to change. Never add to `default`.
dev_reducers = []
