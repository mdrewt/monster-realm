[package]
name = "monster-realm-module"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# cdylib: the SpacetimeDB module (wasm) artifact; rlib lets the pure helpers be
# unit-tested off-instance.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The pure rule layer (SSOT). The server runs the SAME code the client predicts
# with; the `spacetimedb` feature enables game-core's SpacetimeType derives (M6).
game-core = { path = "../game-core", features = ["spacetimedb"] }
# SpacetimeDB module SDK. Version rationale + the 1.x/2.x correction live on the
# workspace pin in ../Cargo.toml. Short version: crate 2.8.1, kept in
# lockstep with the CLI/host — the crate version IS the product version. Write
# 2.x syntax; the three changed spellings are in .claude/skills/spacetimedb-reducer.
spacetimedb = { workspace = true }
# Structured logging facade (captured by the SpacetimeDB host).
log.workspace = true
# NFC canonicalization for player/monster names (#27c, guards::validate_name).
unicode-normalization = { workspace = true }
# Argon2id for the world password (access.rs). Pure Rust, builds for wasm32-unknown-unknown, and
# hashing with a caller-supplied salt reads no clock and no randomness. `alloc` only: the PHC
# string format and the crate's own salt generator stay out. Not a [workspace.dependencies]
# entry: single consumer.
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
# The world attestation (world_binding.rs): an Ed25519 signature check, the token's base64url
# segments and its JSON claims. Pure Rust, all three build for wasm32-unknown-unknown, and none
# reads a clock or randomness. `ed25519-dalek` takes no default feature: `fast` buys 4 percent
# for 11 KB and `zeroize` guards secret keys, and the module holds none. `base64` stays on the
# 0.21 line the lock already holds. Not [workspace.dependencies] entries: single consumer.
ed25519-dalek = { version = "3.0.0", default-features = false }
base64 = { version = "0.21", default-features = false, features = ["alloc"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Property testing for the evaluate_train seam (M9b-tail, raising_tests.rs).
proptest = { workspace = true }
# AST walker for the crate-wide deletion-gate census
# (privacy_enforcement_tests.rs): every reducer that reaches a manifest-classified
# write must carry a depth-0 `crate::guards::require_*` gate before it or be a
# declared exemption. A genuine whole-crate scan uses a
# real parser, never string/regex. Test-only (cfg(test) consumer); Cargo.lock
# resolves this to the syn already in the tree (spacetimedb's macros), so no new
# package enters. `visit` because a hand-rolled Expr walk that misses one
# variant is a hole; syn's visitor covers every node. Not a
# [workspace.dependencies] entry: single consumer.
syn = { version = "2", features = ["full", "visit"] }
# SHA-256, to derive the account service's `local-dev` attestation signing key as
# `account-service/src/keys.ts` does (world_binding_tests.rs). Already in the tree under
# `ed25519-dalek`.
sha2 = { version = "0.11", default-features = false }

[features]
# The ownership features (docs/local-play.md §3, "The build input"; the constants are computed
# from them in src/accounts.rs `build_profile`). A release feature wins over a dev feature.
#
# `open_join` is in `default`: a build that names no feature is the test build. It admits
# anonymous players and trusts the dev issuers. A module to ship is built by
# `just release-module <official|world>`, which names exactly one release feature and no default.
default = ["open_join"]
# A release build for the official server: the production login issuer, ownership enforced.
official = []
# A release build for a world a player hosts: no login issuer, ownership enforced.
world = []
# The dev login issuers; ownership is still enforced (the dev-enforcing build).
dev_issuers = []
# Switches the ownership check off, for tests and anonymous play. Implies `dev_issuers`.
open_join = ["dev_issuers"]
# Dev/test-only reducers (grant_bait, dev_expire_tactical_window), OFF in release/publish.
# Enabled for the e2e via a pre-built wasm + `spacetime publish --bin-path`.
# `spacetime build --features` exists (v1.11.0 through v2.8.1) but is `.hide(true)`, so it
# never shows in `--help`; the `--bin-path` route is the one the recipes use. Implies
# `open_join`. Never add to `default`.
dev_reducers = ["open_join"]
# The load-test build (`just load-host`): game-core's 100 generated zones and the dev reducer
# `dev_place_in_load_zone`. It implies `dev_reducers`, so nothing that refuses a dev build publishes
# it. Never add to `default`.
load_test_zones = ["game-core/load_test_zones", "dev_reducers"]
