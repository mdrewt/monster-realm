# Blessed equivalent-mutant exclusions (each entry states why the mutant is equivalent).
# Every entry needs an equivalence/hang proof and is deleted the moment surrounding code makes
# it killable.
#
# 1. toward_home Y-branch (npc/rules.rs:61:15): |dx| < |dy| → dy != 0, so
#    `dy > 0` and `dy >= 0` are indistinguishable on the reachable domain.
#    Line-pinned: drift resurfaces the mutant → nightly red → re-pin consciously.
#
# 2. apply_entry_ability EntryHeal guard (ability.rs:170:60): `current_hp < max_hp`
#    vs `current_hp <= max_hp` produce identical output because the branch body
#    clamps: `current_hp.saturating_add(heal).min(max_hp)`. At current_hp == max_hp
#    both branches yield max_hp after the clamp; no test can distinguish them.
#    Proved by EARS-h-1a (boundary_full_hp_no_heal) in m14_5h_tests.rs ("no mutation
#    test can be written here to distinguish the two operators"). Line-pinned;
#    re-pinned from 169 to 170 (fix-nightly-mutants: one line of code inserted above
#    the condition between M14.5h and the nightly run 29320384291).
#
# 3. TradeStatus::is_active (trading/types.rs:56:9): `replace TradeStatus::is_active
#    -> bool with true` is equivalent. Both Pending and ConfirmedByCounterparty return
#    true; terminal state is a DELETED ROW not an enum variant, so `is_active()` is
#    correctly always true. No behavioral test can distinguish correct-always-true from
#    mutation-always-true. Line-pinned.
#
# 4. RETIRED by slice EG3 (2026-08-05). The fourth entry
#    (content.rs:624:5 load_evolution_paths -> Ok(vec![])) was CONTINGENTLY
#    equivalent — only while content/evolution_paths/ was deliberately empty.
#    EG3 authored the real ten-edge graph, so the mutation is now killable and
#    is killed for real by `eg3_load_evolution_paths_returns_the_authored_graph`
#    (game-core/src/content.rs) plus the exact-shape pin T2 in
#    game-core/tests/eg3_evolution_graph.rs. Retired in the two places its own
#    self-expiry instructions named: this entry and the canary test. The list is
#    back to THREE permanent, equivalent-by-construction exclusions
#    (entries 1-3; later entries are listed below, each with its own proof).
#
# 5. Five `tiled_import` dev-tool JSON parser mutants that never terminate:
#    a. The four `pos += 1` -> `pos *= 1` ones (Parser::skip_whitespace, Parser::parse_number x3):
#       `pos` never advances, a pure CPU spin that cargo-mutants can only end by its timeout.
#       Line-pinned to exactly those four (the other `*=` mutants in those functions are KILLED by
#       tests and must keep running); drift is safe: a shifted mutant resurfaces as a tolerated
#       timeout, never as a missed one.
#    b. `pos += 1` -> `pos -= 1` after the ',' of Parser::parse_array (228:30): the parser
#       ping-pongs between two positions pushing into `arr` forever. It allocates ~550 MB/s, so on
#       a 16 GB runner it OOMs the whole machine in ~30 s — the runner then dies with "The runner
#       has received a shutdown signal" (Nightly 2026-11-02/03/05 and the 0/6 shard of run
#       42162208875, reproduced with a resource monitor: tiled_import RSS 1 GB -> 15.4 GB, runner
#       dead 2m47s after the baseline). The Nightly's timeout is longer than it takes to fill
#       memory, so this one is NOT safe to let drift: it is matched by column (:30) and
#       function, not by line, and this also covers the finite `-=` at 231:30 (the ']' arm).
#
# 6. dijkstra stale-entry guard (tactics/movement.rs:112:60): `best[here].d < cost` -> `>`.
#    A popped heap entry always has cost >= best[here] (best only ever decreases and every
#    push records the cost it just stored), so `d > cost` is never true and the guard never
#    skips - exactly like `<` for d == cost. With the guard inert, a stale entry (d < cost) is
#    processed anyway, but its relaxations are `candidate = cost + w >= d + w >= best[next]`:
#    the fresh, cheaper entry for `here` pops first and has already relaxed every neighbour to
#    <= d + w, so the strict `candidate < d` relaxation never wins. dist/pred are identical on
#    every input; the full game-core suite (incl. integration tests) stays green with it applied.
#    Keyed by column (:60) + function, not line: drift cannot re-expose a different mutant.
#
# 7. cancel_queue waiting-order guard (tactics/queue.rs:969:25): `mine < theirs` -> `<=`.
#    `mine == theirs` only when `unit == waiting` (initiative positions are unique), and that
#    case already returned AlreadyActing at the `waiting == unit` check above, so `<` and `<=`
#    agree on every reachable input (the `==` and `>` mutants at the same site ARE killed and
#    keep running). Keyed by column (:25) + function.
#
#
# Server-module exclusions (entries 8-17). The server gate is zero-tolerance, like game-core: each
# of these was first attacked with a test (an exhaustive truth table / boundary table / the full
# suite) and survives it, because the mutated code cannot change anything observable. All are
# keyed by file + function + operator + column, never by a bare line. Each is deleted the moment
# the code around it makes the mutant observable.
#
# 8. dev-only reducers (`#[cfg(feature = "dev_reducers")]`): start_wild_battle (battle.rs:559
#    `!=`->`==`), grant_bait (taming.rs:325 `==`->`!=`), dev_start_tactical_wild (tactics.rs
#    2078 x3). The nightly mutates the default-feature build, which does not compile these
#    functions, so their mutants survive vacuously (the mutated source never builds into the test
#    binary). They are never shipped (the release module has no dev reducers) and are killed for
#    real by tests that `just test` runs with `--features dev_reducers`
#    (e.g. dev_start_tactical_wild_admits_only_the_player_and_the_module_owner_mutw3).
#
# 9. apply_delta (tactics_settle.rs:362:36) `<` -> `<=` on the resize guard: Vec::resize(n, 0) at
#    len == n is a no-op, so the two comparisons differ only where the result is identical (an
#    exhaustive shorter/equal/longer histogram table test passes with the mutant applied).
#
# 10. settle_log (tactics_settle.rs:498:5) `-> ()` and the two `delete !` guards in pay_ledger
#     (532:12, 539:8): settle_log = json_escape + log::info!, returns (), every caller ignores
#     it; the pay_ledger guards wrap only an mr_log(...) call. Only a log line changes - no row,
#     event, ledger or wallet. The killable `delete !` mutants in pay_ledger (563:18, 581:31) are
#     NOT matched (column-keyed) and are killed by tests.
#
# 11. account_state_is_legal (accounts.rs:150:17) `&&` -> `||` on the terminal clause: it differs
#     only when the stamp-paired predicate is already false (an exhaustive truth table over every
#     status x stamp combination passes with the mutant applied).
#
# 12. plan_reap (playtest.rs:81:20) `>` -> `>=`: at over == 0 the code extends with the empty
#     slice fresh[..0], i.e. nothing.
#
# 13. PlaytestKind::code (playtest.rs:47:9) `-> 1`: equivalent while PlaytestKind has one variant
#     whose code is the literal 1 (the `-> 0` mutant is killed). Remove this entry when a second
#     variant exists.
#
# 14. sync_content_inner (content.rs:123:21) `>` -> `==`/`<`/`>=` on `stranded > 0`: the guard
#     gates only a log::warn!, nothing observable.
#
# 15. validate_enum_rosters (content.rs:879:5) `-> Ok(())`: takes no input, reads only const
#     rosters and always returns Ok(()) today. CONTINGENT equivalence: if a roster is ever made
#     invalid the mutant becomes observable; the roster-totality logic itself is killed directly
#     by the check_roster_is_total tests.
#
# 16. propose_trade (trading.rs:357:27, 374:30) `>` -> `>=` on `currency > 0`: for u64, `c >= 0`
#     is always true, so a zero offer additionally reads the wallet and escrow (read-only) and
#     compares `0 > balance.saturating_sub(escrowed)`, false for every u64; Result and writes are
#     identical (the suite already exercises zero-currency proposals).
#
# 17. battle_with_forced_terminal (battle.rs:1628:56) `||` -> `&&`: `names_deleting` feeds only a
#     debug_assert whose postcondition the original never violates, and the mutant can fire it
#     only in a subset of the cases the original could, so no input changes the returned Battle or
#     panics. And ranked_enforcement_active (pvp.rs:89:5) `-> false`: it is a thin wrapper over
#     issuers_configured(ALLOWED_ISSUERS), which is the fail-closed placeholder today; the pure
#     predicate has its full matrix (ea_ra_06b) and the `-> true` mutant is caught by canary
#     ea_ra_06a. EXPIRY: when ALLOWED_ISSUERS gains a real issuer the canary fires - remove this
#     entry in that same change.
#
