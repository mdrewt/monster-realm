# Prometheus — storage + scraping + RECORDING RULES ONLY (M20 D4 / OBS-18).
#
# There is deliberately NO `alerting:` block and no `alert:` stanza in any loaded rule file.
# Prometheus's native alerting has exactly one sink, Alertmanager, and this stack has no
# Alertmanager by design (OBS-19) — so an `alert:` rule here would evaluate into nothing. 100% of
# alert evaluation AND notification routing lives in Grafana OSS unified alerting, which queries
# this Prometheus (and Loki) as datasources. Both halves are gated: checkNoAlertingBlock and
# checkRulesAreRecordOnly in checks/stack-config-checks.mjs.
#
# All targets are loopback: every process in this stack runs on the host network bound to
# 127.0.0.1, and SpacetimeDB itself stays loopback-bound per OQ1 (see docker-compose.yml).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: monster-realm

rule_files:
  - /etc/prometheus/rules/recording.rules.yml

scrape_configs:
  # S1 — SpacetimeDB's own host-computed metrics. Free, zero module instrumentation, zero
  # wasm-sandbox crossing (D1). NOTE: /v1/metrics is unauthenticated by a confirmed, permanent
  # gap in the shipped 2.6.0 binary; it is safe here ONLY because the port is loopback-bound
  # (OQ1/OBS-17). If SpacetimeDB is ever started with a wider --listen-addr, this endpoint
  # discloses table names, row counts and connected-player counts to that network.
  #
  # `spacetime_scheduled_function_delay_seconds` (new in 2.8.0, labelled {db, function, le})
  # arrives on THIS existing job — it is one more family in the same /v1/metrics exposition, so
  # the mr-scheduler recording group in rules/recording.rules.yml needs NO config change here.
  # A second scrape job for it would be a duplicate scrape of the same endpoint: double the load
  # on the module host, two copies of every other family under different `job` labels, and any
  # rule that does not pin `job=` would then double-count. Deliberately not added.
  - job_name: spacetimedb
    metrics_path: /v1/metrics
    static_configs:
      - targets: ['127.0.0.1:3000']

  # S1b — Alloy's own self-metrics. Carries the S2 log-derived counters (OBS-13) AND doubles as
  # the liveness probe for the sole telemetry agent (OBS-39) with no extra container.
  - job_name: alloy
    static_configs:
      - targets: ['127.0.0.1:12345']

  - job_name: node_exporter
    static_configs:
      - targets: ['127.0.0.1:9100']

  # OBS-46 — the trace relay's own liveness. `metrics_path` is NOT optional here: Prometheus
  # defaults to /metrics, the relay serves /health and nothing else (its route set is exactly one
  # key), so omitting this line would 404 every scrape, pin up=0 and leave the dead-man's switch in
  # grafana/provisioning/alerting/rules.yml permanently firing. The body is a real exposition
  # document carrying mr_trace_relay_lines_read_total, so a SILENTLY stalled tail — the failure a
  # wrong mount mode produces, which `up` alone cannot see — shows up as a flat counter.
  # The port must equal the relay's own `--web.listen-address` in docker-compose.yml.
  - job_name: mr-trace-relay
    metrics_path: /health
    static_configs:
      - targets: ['127.0.0.1:9101']
