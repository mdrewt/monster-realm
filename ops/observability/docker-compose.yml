# Monster Realm — self-hosted observability stack (M20 / ADR-0180, slice m20b).
#
# NETWORK POSTURE (ADR-0180 amendment "Correction 1", m20b plan §5b-A). Every service runs on
# the HOST network and binds 127.0.0.1 ONLY. `ports:` is deliberately absent everywhere: under
# `network_mode: host` a `ports:` block is silently inert, so it would be false comfort rather
# than a control. A bridge network is not usable here — a container's 127.0.0.1 is itself, and a
# socket bound to the host's 127.0.0.1 refuses a connection destined for the bridge gateway, so
# Prometheus could not scrape SpacetimeDB at all. The two bridge-preserving repairs both require
# SpacetimeDB to bind a non-loopback address, which reopens /v1/metrics' confirmed-permanent
# unauthenticated gap (OQ1 / OBS-17). Under host networking each service's own listen flag IS the
# security boundary, which is why every one of them is explicit below and mechanically gated by
# `checks/stack-config-checks.mjs` -> checkListenAddrsLoopback (omission FAILS: every upstream
# default here is 0.0.0.0, so silence is the trap).
#
# THE ONE VARIABLE that changes if this box is ever exposed (M-playtest-a2) is
# MR_CADDY_BIND_ADDR. Every other service stays loopback-bound permanently.
#
# OQ1 is ANSWERED, not guessed: M-playtest-a-deployment.spec.md fixes deployment as local-only,
# no hosted deployment (rescoped 2026-07-17), same box. See ../../docs/observability-dr-runbook.md
# for the drift risk if the operator ever widens SpacetimeDB's own --listen-addr.
#
# RESOURCE CAPS BELOW ARE PLACEHOLDERS, honestly labelled. M20 §5 sequences m20b in PARALLEL with
# m20d (mr-load-driver, the thing that produces a real footprint figure), so no measured number
# exists yet. Re-size at post-integration verification — do not read these as measured.
#
# The 8th service, `mr-trace-relay` (D15/D17), is at the bottom of this file. It landed in slice
# 13r-b together with its Prometheus scrape job (prometheus.yml) and its own dead-man's-switch
# alert rule (grafana/provisioning/alerting/rules.yml) — all three in ONE change, because a scrape
# target without a process pins `up=0` forever and trains the operator to ignore a dead-man's
# switch, while a process with no switch is one whose death nobody notices.

services:
  prometheus:
    image: prom/prometheus:v3.13.2@sha256:1147c92841726a6fef55fe6124491d6f85480f8de204f7d420304ca5bbd0a8f7
    network_mode: host
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # D11: 30-day metric retention (default is 15d).
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=127.0.0.1:9090
      # OBS-38: S4's browser-OTLP metrics arrive by PUSH, not scrape. Alloy's
      # otelcol.exporter.prometheus has no scrapeable endpoint — remote-write is its only sink.
      - --web.enable-remote-write-receiver
    mem_limit: 2g
    cpus: 1.0

  alloy:
    image: grafana/alloy:v1.18.1@sha256:754409730f1a4ed9781f8a2ea3b6a8c55750ee125a267ecf8fb449f9a25c109a
    network_mode: host
    restart: unless-stopped
    # ADR-0190 D2. The image's ENTRYPOINT runs as uid 0, but it ships /var/lib/alloy and
    # /var/lib/alloy/data as mode 0770 owned by 473:473 (`alloy` in the image's own passwd file).
    # Under `cap_drop: [ALL]` even uid 0 has no CAP_DAC_OVERRIDE, so it can neither traverse nor
    # create them: `mkdir: cannot create directory '/var/lib/alloy': Permission denied`, then a
    # crash-loop. Running as the image's own user fixes it while KEEPING cap_drop: ALL —
    # `cap_add: [DAC_OVERRIDE]` was rejected as the alternative, since it hands a capability back
    # to root to work around a directory the image already owns correctly.
    #
    # Numeric on purpose, matching prometheus/node_exporter above: compose passes this string
    # straight to docker and a NAME would be resolved in-container against /etc/passwd, so an
    # image rebuild could silently renumber `alloy` while this file still read correctly.
    #
    # Operator preconditions (neither is a regression — root had no DAC_OVERRIDE either):
    #   * uid 473 needs host-side r-x on ${MR_SPACETIME_DATA_DIR}/replicas, the mount tailed
    #     below. If it is wrong the failure is a silent tail stall, not a crash — which is what
    #     the AlloyIngestStalled rule in grafana/provisioning/alerting/rules.yml exists to catch.
    #   * a POPULATED root-owned `alloy-data` volume left by an earlier root-running boot is not
    #     self-healing (`mkdir /var/lib/alloy/data/remotecfg: permission denied`, exit 1). An
    #     empty named volume is auto-chowned from the image path and boots fine. Remedy is
    #     `docker compose down -v`, which destroys all seven named volumes, not just this one.
    user: "473:473"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # OBS-11 / OBS-45: the SpacetimeDB data dir is mounted READ-ONLY and tailed as files.
      # No subprocess, no module-owner credential. Set MR_SPACETIME_DATA_DIR in .env.
      - ${MR_SPACETIME_DATA_DIR:-/var/lib/spacetime}/replicas:/data/replicas:ro
      - alloy-data:/var/lib/alloy/data
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    mem_limit: 1g
    cpus: 1.0

  loki:
    image: grafana/loki:3.7.6@sha256:83c76da7858a8f4f88117ac521864ac33896fdae7a352a1df4068556e7513f64
    network_mode: host
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    command:
      - -config.file=/etc/loki/loki-config.yml
      - -server.http-listen-address=127.0.0.1
    mem_limit: 2g
    cpus: 1.0

  tempo:
    image: grafana/tempo:2.10.7@sha256:6616b00287a4d7001951b5de117828ad5c6f93744935c1b7a5e044736373352c
    network_mode: host
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempo-data:/var/tempo
    # PARKED, ADR-0190 D1 — the second flag below DOES NOT EXIST in tempo 2.10.7 (nor 3.0.2):
    # `flag provided but not defined`, and the container dies on start. It is retained only
    # because deleting it reds `checkListenAddrsLoopback` in ops/observability/checks/
    # stack-config-checks.mjs, which is outside slice 13r-a's declared file set. The follow-up
    # teaches that predicate to read tempo's binding from tempo/tempo-config.yml:9,11 (where it
    # is already declared as 127.0.0.1) and then deletes this line. Until then that predicate's
    # tempo pass is EVIDENCE-FREE — the eval's G12a tripwire pins this shape and carries the
    # full prescription in its failure message.
    command:
      - -config.file=/etc/tempo/tempo-config.yml
      - -server.http-listen-address=127.0.0.1
    mem_limit: 2g
    cpus: 1.0

  grafana:
    image: grafana/grafana:13.1.3@sha256:e27e68cfd5795c1bea54950766078a02e84dfa3bafe0a4d0e5382f713dfd8e4e
    network_mode: host
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      # Port 3000 belongs to SpacetimeDB on this box; Grafana moves to 3001 (host network).
      - GF_SERVER_HTTP_ADDR=127.0.0.1
      - GF_SERVER_HTTP_PORT=3001
      # No credential literal is ever committed — env indirection only, sourced from .env
      # (gitignored). `:?` fails loudly rather than silently booting an admin/admin instance.
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in ops/observability/.env}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Caddy terminates TLS and fronts Grafana; Grafana itself only ever listens on loopback.
      - GF_SERVER_ROOT_URL=https://grafana.localhost:8443/
      - MR_ALERT_WEBHOOK_URL=${MR_ALERT_WEBHOOK_URL:?set MR_ALERT_WEBHOOK_URL in ops/observability/.env}
    mem_limit: 1g
    cpus: 1.0

  node_exporter:
    image: prom/node-exporter:v1.12.1@sha256:da83fae85603c4e47e6c68369a7d746e2dda683dc35ea2e234b4f171e0d92798
    network_mode: host
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
    volumes:
      - /:/host:ro,rslave
    mem_limit: 256m
    cpus: 0.5

  caddy:
    # Caddy is the one image built rather than pulled: `caddy-ratelimit` is not in the stock
    # binary (D3's differentiated maintenance line — this service carries its own upstream-CVE
    # tracking obligation the other six do not).
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      # THE single exposure variable (see the header). Loopback for the local-only deployment
      # OQ1 fixes; widening this is the whole change M-playtest-a2 would need to make.
      - MR_CADDY_BIND_ADDR=127.0.0.1
      - MR_GRAFANA_BASIC_AUTH_USER=${MR_GRAFANA_BASIC_AUTH_USER:-operator}
      - MR_GRAFANA_BASIC_AUTH_HASH=${MR_GRAFANA_BASIC_AUTH_HASH:?generate with caddy hash-password, then set it in ops/observability/.env}
      - MR_OTLP_ALLOWED_ORIGIN=${MR_OTLP_ALLOWED_ORIGIN:-https://localhost:5173}
    mem_limit: 256m
    cpus: 0.5

  # D15/D17/OBS-45/OBS-46 — the trace relay: it tails the SAME read-only replicas bind mount
  # Alloy does, reconstructs enter/exit spans, serves /health as a scrape target and prints its
  # OTLP/HTTP JSON document on stdout. Nothing ingests that document yet (the OTLP POST client is
  # parked to 13r-c) and `$trace_pair_set` is empty, so today it is a dead-man's-switched process
  # emitting an empty span list — deliberately, and stated in ADR-0191 rather than implied.
  #
  # Three properties of this block are load-bearing and each is mechanically gated (eval G9n):
  #   * `user: "473:473"` is ALLOY's uid, not a second one. Both services read the same host
  #     directory, so a second identity would force the operator to widen host-side r-x to another
  #     uid for no benefit. The operator precondition is therefore unchanged — see the alloy block
  #     above and docs/observability-dr-runbook.md; a wrong mode is a SILENT tail stall, which is
  #     what the mr_trace_relay_lines_read_total counter on /health exists to make visible.
  #   * the `command:` list BEGINS with `node`. The node image's entrypoint does `set -- node "$@"`
  #     only when $1 does not start with `-`, so a bare `--logs-dir=...` first item would be parsed
  #     as a NODE option and the container would die on start. There is still no `entrypoint:`.
  #   * the container target is `/data/module-logs`, NOT `/data/replicas`. checkModuleLogsMountReadOnly
  #     reads ANY whole-file line trimming to `- ...replicas...` as a mount and requires it to end
  #     `:ro`, so a `- --logs-dir=/data/replicas` command item would be read as a writable mount and
  #     fail that check. The mount SOURCE — which is what "the same bind mount as Alloy" is a claim
  #     about — is byte-identical to alloy's above.
  # There is deliberately no `environment:`, no `env_file:` and no `entrypoint:`: the node runtime
  # reads NODE_OPTIONS, HTTPS_PROXY and friends from the environment, so a denylist of variable
  # names would be unclosable. This service's entire configuration surface is its three flags.
  mr-trace-relay:
    image: node:24-alpine@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43
    network_mode: host
    restart: unless-stopped
    user: "473:473"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./relay:/opt/relay:ro
      - ${MR_SPACETIME_DATA_DIR:-/var/lib/spacetime}/replicas:/data/module-logs:ro
    command:
      - node
      - /opt/relay/daemon.mjs
      - --logs-dir=/data/module-logs
      - --web.listen-address=127.0.0.1:9101
      - --trace-pair-set=/opt/relay/trace-pair-set.json
    mem_limit: 256m
    cpus: 0.5

volumes:
  prometheus-data:
  alloy-data:
  loki-data:
  tempo-data:
  grafana-data:
  caddy-data:
  caddy-config:
