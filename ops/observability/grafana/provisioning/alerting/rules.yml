# Grafana OSS unified alerting — 100% of alert evaluation AND notification routing (D4/OBS-19).
# Prometheus computes recording rules only; it has no `alerting:` block and no Alertmanager to
# route to, so an alert rule there would evaluate into nothing.
#
# Every rule below is routed to a DEFINED, non-placeholder contact point — see
# contact-points.yml and notification-policies.yml. checkAlertRuleHasReceiver fails the build if
# a rule ever routes to a receiver that does not exist, or to a contact point that structurally
# exists but notifies nobody (`receivers: []`, a placeholder URL). "The alert fires into
# nothing" is the exact failure D4 exists to prevent, and it has two disguises, not one.
#
# The `mr-trace-relay` dead-man's switch (OBS-46) is the third rule below. It landed in slice 13r-b
# together with the service and its scrape job, in one change: a rule watching a target that does
# not exist sits permanently firing and trains the operator to ignore a dead-man's switch, and a
# service with no rule is a process whose death nobody notices. It is a DISTINCT rule on a DISTINCT
# target rather than an `or`-widened AlloyDown, because one rule watching two processes fires for
# either and names neither.

apiVersion: 1

groups:
  - orgId: 1
    name: meta-monitoring
    folder: Monster Realm
    # ADR-0190 D4. Grafana 13's alert scheduler runs on a FIXED 10s base tick and refuses any
    # group interval that is not an exact multiple of it — provisioning aborts with
    # `interval (15s) should be non-zero and divided exactly by scheduler interval: 10` and the
    # container exits, i.e. the dead-man's-switch host itself crash-loops. 20s is the smallest
    # legal value at or above the 15s this group originally carried, so it is derived, not picked.
    interval: 20s
    rules:
      # OBS-39 — the sole telemetry agent's dead-man's switch. Alloy failing would black out
      # BOTH S2 and S4 ingestion at once with nothing else in the stack noticing; S1b's scrape
      # target doubles as the liveness probe, so this costs no new signal and no new container.
      #
      # THREE DIFFERENT NUMBERS live here and only one of them belongs to this file:
      #   15s — Prometheus `scrape_interval` (and `evaluation_interval`), prometheus.yml:14-15.
      #         How often Alloy is scraped. UNCHANGED by ADR-0190.
      #   20s — this group's `interval:` above. How often Grafana evaluates the rule.
      #   60s — the `for:` below. How long the condition must hold before the alert fires.
      # `for:` is 60s and not 45s because Grafana can only transition alert state on an
      # evaluation boundary: under a 20s interval a `for: 45s` fires at 60s anyway, so writing
      # 45 would state a number the scheduler never uses.
      - uid: mr-alloy-down
        title: AlloyDown
        condition: C
        for: 60s
        labels:
          severity: critical
        annotations:
          summary: Alloy has not been scraped for 60s — S2 and S4 ingestion are both dark.
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: mr-prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: up{job="alloy"}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1

      # OBS-46 — the trace relay's dead-man's switch. Every number here MIRRORS AlloyDown above,
      # deliberately: the same 60s pending period (this group's 20s interval divides it exactly),
      # the same `lt 1` threshold on the same `mr-prometheus` datasource, and the same
      # `severity: critical` label — notification-policies.yml:8-9 routes on that label, so a
      # relay rule without it would silently take the catch-all 4h repeat interval instead of the
      # 1h one its sibling gets. The uid is distinct: Grafana keys provisioned rules by uid, so a
      # shared one would silently REPLACE the first rule and leave one where the operator reads two.
      # `up` is 1 when the target is healthy, so the direction is `lt`, never `gt`.
      - uid: mr-trace-relay-down
        title: TraceRelayDown
        condition: C
        for: 60s
        labels:
          severity: critical
        annotations:
          summary: mr-trace-relay has not been scraped for 60s — module trace reconstruction is dark.
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: mr-prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: up{job="mr-trace-relay"}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1

      # ADR-0180 amendment "Correction 3" — process liveness is NOT pipeline health.
      # `up` only proves Alloy's HTTP server answers. Alloy hosts independent internal
      # components: if the file tail stalls (bind-mount permission drift, a log-rotation edge
      # case) or the OTLP receiver rejects everything, `up` stays 1 while ingestion is entirely
      # dark — the meta-monitoring rationale fails in exactly the scenario it exists for.
      # This watches actual throughput, so a silently-stalled tail is visible.
      - uid: mr-alloy-ingest-stalled
        title: AlloyIngestStalled
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Alloy is alive but has read zero module_logs bytes for 10m — the S2 tail is stalled, not the process.
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: mr-prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: mr:alloy_log_bytes_read:rate5m
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1

  # ---------------------------------------------------------------------------------------
  # OBS-24b — scheduled-function lateness. A SEPARATE group from `meta-monitoring` above on
  # purpose: that group is scoped to the telemetry pipeline's own self-health (is Alloy alive,
  # is the tail moving, is the relay alive). This rule watches the GAME's scheduled functions,
  # which is a different subject with a different on-call response; folding it into
  # meta-monitoring would make "the meta-monitoring group is firing" stop meaning "the
  # observability stack is broken".
  # ---------------------------------------------------------------------------------------
  - orgId: 1
    name: scheduler-health
    folder: Monster Realm
    # Same 20s as meta-monitoring, and for the same reason: Grafana 13's scheduler runs on a
    # fixed 10s base tick and provisioning ABORTS on any group interval that is not an exact
    # multiple of it. 20s is derived from that tick, not picked.
    interval: 20s
    rules:
      # THREE keys below are load-bearing and each has been "harmonised" away by a well-meaning
      # editor before. Do not repeat that:
      #
      # `noDataState: OK` — this is the ONLY rule in this file that carries it, and the asymmetry
      #   is deliberate. The three meta-monitoring rules query expressions that ALWAYS have a
      #   value: `up{...}` is 0 or 1 for any target Prometheus knows about, and
      #   mr:alloy_log_bytes_read:rate5m is `or vector(0)`-guarded. A lateness RATIO has no such
      #   guarantee: over a window in which nothing was scheduled at all, the numerator and the
      #   denominator are both empty and the series simply does not exist. Grafana's provisioned
      #   default for an absent series is `NoData`, which raises a synthetic `DatasourceNoData`
      #   alert instance that routes through notification-policies.yml's catch-all straight to
      #   the real mr-observability-oncall webhook. A switch that cries wolf every quiet night
      #   trains the operator to ignore it, and then it is worth less than no switch at all. Do
      #   not "harmonise" this key away to match its neighbours.
      #   ACCEPTED CONSEQUENCE, stated plainly rather than discovered later: a scheduled function
      #   that stops running ENTIRELY is SILENT here — no starts means no series means no alert.
      #   That is a liveness gap this rule deliberately does not close; it measures lateness, not
      #   existence. Closing it needs a separate `absent()`-style rule with its own on-call story.
      #
      # `for: 10m` — derived twice over, not a round number. It is 30 x this group's 20s interval
      #   (Grafana only transitions alert state on an evaluation boundary, so a non-multiple would
      #   describe behaviour the scheduler never has), AND it is strictly greater than the 300s
      #   `[5m]` rate window the recorded series are computed over. That second derivation is the
      #   important one: trade_offer_reaper, pvp_deadline_reaper and battle_challenge_reaper are
      #   ONE-SHOT `ScheduleAt::Time` inserts, not interval schedules, so a single late invocation
      #   can spike the ratio hard. Because `for:` outlives the rate window, that spike decays out
      #   of the window before it can ever satisfy the pending period. The `for:` IS the debounce
      #   here — there is no separate smoothing in the expression, and shortening it below 5m
      #   silently re-arms every one-shot reaper as a page.
      #
      # `severity: warning` — needs no routing change and must not acquire one by imitation.
      #   notification-policies.yml routes `critical` on an explicit sub-route (10s group wait,
      #   1h repeat); everything else takes the catch-all default policy, which reaches the SAME
      #   real mr-observability-oncall receiver at a 4h repeat. Lateness is a degradation, not an
      #   outage: it deserves the slower cadence, not the pager cadence its `critical` neighbours
      #   above get.
      - uid: mr-scheduled-function-delayed
        title: ScheduledFunctionDelayed
        condition: C
        for: 10m
        noDataState: OK
        labels:
          severity: warning
        annotations:
          summary: 'More than 1% of {{ $labels.function }} scheduled starts began over 50ms late for 10m — the tick or a deadline reaper is running behind.'
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: mr-prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: mr:scheduled_function_late:ratio5m
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.01
