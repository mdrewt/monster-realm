# Grafana OSS notification routing (D4). Every alert reaches a real receiver: the default policy
# below is a catch-all, so a future rule that forgets to add a matching route still notifies
# rather than falling through to nothing.

apiVersion: 1

policies:
  - orgId: 1
    receiver: mr-observability-oncall
    group_by:
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: mr-observability-oncall
        object_matchers:
          - - severity
            - '='
            - critical
        group_wait: 10s
        repeat_interval: 1h
