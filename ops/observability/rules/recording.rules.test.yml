rule_files:
  - recording.rules.yml

evaluation_interval: 15s

# rate()'s extrapolation leaves each result one ULP from the decimal literal;
# the tolerance is 1 ULP, so any wrong aggregation still fails.
fuzzy_compare: true

tests:
  - interval: 25s
    # Counters are seconds of transaction time; samples are 25 s apart, so
    # rate = increment / 25. Linear series, eval at 10m with the 5m window
    # fully inside the data.
    input_series:
      # movement_tick Reducer rows: +2.5 per step = 0.10 s/s
      - series: 'spacetime_txn_elapsed_time_sec_sum{db="c200a1b2c3d4e5f6a7b8c9d0e1f2a3b4",reducer="movement_tick",txn_type="Reducer"}'
        values: "0+2.5x48"
      # movement_tick Update row: +0.5 per step = 0.02 s/s (0.10 + 0.02 = 0.12)
      - series: 'spacetime_txn_elapsed_time_sec_sum{db="c200a1b2c3d4e5f6a7b8c9d0e1f2a3b4",reducer="movement_tick",txn_type="Update"}'
        values: "0+0.5x48"
      # enqueue_move Reducer row: +0.75 per step = 0.03 s/s
      - series: 'spacetime_txn_elapsed_time_sec_sum{db="c200a1b2c3d4e5f6a7b8c9d0e1f2a3b4",reducer="enqueue_move",txn_type="Reducer"}'
        values: "0+0.75x48"
      # non-reducer work (empty reducer label): +1.25 per step = 0.05 s/s
      - series: 'spacetime_txn_elapsed_time_sec_sum{db="c200a1b2c3d4e5f6a7b8c9d0e1f2a3b4",reducer="",txn_type="Subscribe"}'
        values: "0+1.25x48"
    promql_expr_test:
      # One sample per reducer value; every other label is aggregated away.
      - expr: mr:reducer_thread_share:rate5m
        eval_time: 10m
        exp_samples:
          - labels: 'mr:reducer_thread_share:rate5m{reducer="movement_tick"}'
            value: 0.12
          - labels: 'mr:reducer_thread_share:rate5m{reducer="enqueue_move"}'
            value: 0.03
          # An empty reducer label is no label: the non-reducer row is {}.
          - labels: 'mr:reducer_thread_share:rate5m{}'
            value: 0.05
      # The dashboard total: 0.12 + 0.03 + 0.05.
      - expr: sum(mr:reducer_thread_share:rate5m)
        eval_time: 10m
        exp_samples:
          - labels: "{}"
            value: 0.2
