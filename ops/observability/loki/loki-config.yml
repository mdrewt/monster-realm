# Loki — log storage for the S2 path (M20 / ADR-0180 D3). Stock image, configuration only
# (OBS-33: the AGPLv3 network-copyleft analysis holds only while these images stay unmodified).
#
# Every listener is loopback: Caddy is the only process with any externally-facing policy, and
# under `network_mode: host` each service's own listen address IS the security boundary.

auth_enabled: false

server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: '2024-01-01'
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        # 24h is REQUIRED for retention to work at all — Loki's retention operates on whole
        # index periods. A different period here silently disables the deletion configured below.
        period: 24h

limits_config:
  # D11 — 30-day log retention.
  retention_period: 30d
  # D12/OBS-36 backstop: the S2 label set is already bounded to {reducer, evt} in config.alloy,
  # but a low per-stream ceiling turns any future unbounded-label mistake into a loud rejection
  # rather than a silent cardinality explosion.
  max_label_names_per_series: 8
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32

compactor:
  working_directory: /loki/compactor
  # WITHOUT THIS, `retention_period` ABOVE IS A DOCUMENTED NO-OP. It defaults to false, so
  # deletion simply never runs: logs accumulate forever, with no error and no alert, until the
  # disk fills weeks later. checkRetentionConfigured fails the build if these two ever separate.
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem
