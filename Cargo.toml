# monster-realm — cargo workspace (ADR-0005 single repo).
# `resolver = "2"` keeps per-crate feature sets from leaking across the graph —
# the structural half of feature-isolation (the eval is the proof, ADR-0003).
[workspace]
resolver = "2"
members = ["game-core", "client-wasm", "server-module", "sim-harness", "evals/release-overflow-teeth"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# SSOT for shared dependency versions: declare once here, reference with
# `dep.workspace = true` in members.
[workspace.dependencies]
# Perf-budget bench harness (m20a, OBS-5/OBS-6, ADR-0180 D7) — game-core
# dev-dep ONLY. EXACT pin: the harness reads criterion's documented-private
# target/criterion/<id>/new/estimates.json (mean.point_estimate, ns) back for
# the ceiling gate, so a criterion bump must be a deliberate, reviewed change
# (R4 fail-loud; cargo-criterion is the documented fallback). default-features
# off drops plotters/rayon; cargo_bench_support keeps `cargo bench` wiring and
# CRITERION_HOME resolution (verified honored under this feature set).
criterion = { version = "=0.5.1", default-features = false, features = ["cargo_bench_support"] }
serde_json = "1"
# The client-prediction wasm boundary (ADR-0036), built via wasm-pack.
wasm-bindgen = "0.2"
# M3 marshaling boundary (ADR-0036): JS<->serde value bridge for the consumable
# `apply_move`/`zone_map` exports, plus a browser panic hook. Pure marshaling —
# the no-logic-in-wrapper eval proves no rules cross here.
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
# Server module SDK (ADR-0037). Pin it to the SAME version as the `spacetime`
# CLI/host: the crate version IS the product version (it always has been — the
# monorepo's [workspace.package] version equals the product version at every tag,
# in both majors). The old comment here claimed "crate 1.12 matches CLI 2.6.0
# (crate != product)"; that was FALSE and left the module a full major behind for
# six months. See ADR-0197.
#
# 2026-08-16: bumped 1.12.0 -> 2.8.1 alongside the CLI (M-stdb-2x-module-sdk,
# EXECUTED). The 1.x -> 2.x source port was mechanical and schema-neutral:
#   #[table|view(name = X)] -> accessor = X   (the canonical SQL table name
#                                              defaults to the accessor ident, so
#                                              no table was renamed — proven by a
#                                              77/77 identical table-name diff)
#   ctx.sender  (field)     -> ctx.sender()   (method)
#   ctx.identity()          -> ctx.database_identity()  (the former is deprecated)
# When bumping again, remember the gates move too: ~21 Rust source-scanning teeth
# tests and several evals/ scanners encode this attribute syntax literally.
spacetimedb = "2.8.1"
# Content: serde derive + RON parser (pure; safe under the determinism guard).
serde = { version = "1", features = ["derive"] }
ron = "0.8"
# Name hardening (#27c): NFC canonicalization before charset/length checks.
# Pure, no_std-capable, wasm-safe.
unicode-normalization = "0.1"
# Property testing for the logic-heavy rules (ADR-0038).
proptest = "1"
# Structured logging facade (captured by the SpacetimeDB host) — server-module dep.
log = "0.4"

# Release/bench fail-loud (ADR-0003 / ADR-0055): shipped release + bench artifacts
# (the wasm prediction pkg, the SpacetimeDB cdylib, criterion benches) must PANIC on
# integer overflow rather than silently wrap, so debug/test and release agree on
# behavior. Profiles are honored only at the workspace root.
[profile.release]
overflow-checks = true

[profile.bench]
overflow-checks = true
