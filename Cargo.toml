# monster-realm — cargo workspace (one repository for every crate).
# `resolver = "2"` keeps per-crate feature sets from leaking across the graph —
# the structural half of feature-isolation (the feature-isolation eval is the proof).
[workspace]
resolver = "2"
members = ["game-core", "client-wasm", "server-module", "sim-harness", "evals/release-overflow-teeth"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# SSOT for shared dependency versions: declare once here, reference with
# `dep.workspace = true` in members.
[workspace.dependencies]
# Perf-budget bench harness — game-core
# dev-dep ONLY. EXACT pin: the harness reads criterion's documented-private
# target/criterion/<id>/new/estimates.json (mean.point_estimate, ns) back for
# the ceiling gate, so a criterion bump must be a deliberate, reviewed change
# (R4 fail-loud; cargo-criterion is the documented fallback). default-features
# off drops plotters/rayon; cargo_bench_support keeps `cargo bench` wiring and
# CRITERION_HOME resolution (verified honored under this feature set).
criterion = { version = "=0.5.1", default-features = false, features = ["cargo_bench_support"] }
serde_json = "1"
# The client-prediction wasm boundary, built via wasm-pack.
wasm-bindgen = "0.2"
# M3 marshaling boundary: JS<->serde value bridge for the consumable
# `apply_move`/`zone_map` exports, plus a browser panic hook. Pure marshaling —
# the no-logic-in-wrapper eval proves no rules cross here.
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
# Server module SDK, pinned exactly to the version of the `spacetimedb` CLI/host and the npm
# SDK: the crate version IS the product version (the vendor's monorepo gives every crate the
# product's version at each tag). See docs/DECISIONS.md ("SpacetimeDB versions move in
# lockstep") and docs/runbooks/spacetimedb-upgrade.md for a hop.
#
# Two of its crates, `spacetimedb` and `spacetimedb-bindings-sys`, build from the copies of
# their crates.io packages under vendor/ (the [patch.crates-io] table below), patched in
# `#[cfg]` attributes so that the module's native tests reach the in-memory host in
# server-module/src/native_host_tests.rs; on wasm the patched attributes select what the
# originals select. See vendor/README.md and docs/DECISIONS.md ("Server-module tests run on
# our own host ABI, over the two vendor crates patched where they refuse a native host").
# The pin is exact because cargo uses a [patch] entry only when its version matches it.
#
# The crate's `unstable` feature is on, and the module uses nothing it gates. What it adds
# to the built module, and what checks the generated definition instead: docs/DECISIONS.md
# ("The crate's `unstable` feature is on; the generated definition is checked instead").
#
# Module code uses 2.x syntax (`#[table(accessor = x)]`, `ctx.sender()`,
# `ctx.database_identity()`); ~21 Rust source-scanning teeth tests and several evals/
# scanners encode that attribute syntax literally, so a syntax change moves them too.
spacetimedb = { version = "=2.16.1", features = ["unstable"] }
# Content: serde derive + RON parser (pure; safe under the determinism guard).
serde = { version = "1", features = ["derive"] }
ron = "0.8"
# Name hardening (#27c): NFC canonicalization before charset/length checks.
# Pure, no_std-capable, wasm-safe.
unicode-normalization = "0.1"
# Property testing for the logic-heavy rules.
proptest = "1"
# Structured logging facade (captured by the SpacetimeDB host) — server-module dep.
log = "0.4"

# Release/bench fail-loud: shipped release + bench artifacts
# (the wasm prediction pkg, the SpacetimeDB cdylib, criterion benches) must PANIC on
# integer overflow rather than silently wrap, so debug/test and release agree on
# behavior. Profiles are honored only at the workspace root.
[profile.release]
overflow-checks = true

[profile.bench]
overflow-checks = true

# cargo-mutants builds with this profile (`profile` in .cargo/mutants.toml). It is the test profile
# minus debuginfo, which nothing in a mutation verdict reads and which costs ~1 s of every
# per-mutant rebuild. opt-level, debug-assertions and overflow-checks are inherited from `test`
# unchanged, so every mutant behaves exactly as it does under `cargo test`.
[profile.mutants]
inherits = "test"
debug = "none"

# The two SpacetimeDB crates built from patched copies of their crates.io packages (see the
# `spacetimedb` pin above and vendor/README.md). The guard test in
# server-module/src/native_host_tests.rs checks these entries against vendor/.
[patch.crates-io]
spacetimedb = { path = "vendor/spacetimedb" }
spacetimedb-bindings-sys = { path = "vendor/spacetimedb-bindings-sys" }
