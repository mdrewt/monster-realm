<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>monster-realm</title>
  </head>
  <body style="margin: 0; background: #0b0d12">
    <div id="app"></div>
    <!-- M12d overlay shells — hidden by default; managed by JS views (ADR-0071). -->
    <div id="dialogue-overlay" style="display:none">
      <div id="dialogue-npc-name"></div>
      <div id="dialogue-node-text"></div>
      <div id="dialogue-choices"></div>
    </div>
    <div id="quest-log-overlay" style="display:none">
      <ul id="quest-log-list"></ul>
    </div>
    <div id="heal-overlay" style="display:none">
      <ul id="heal-list"></ul>
    </div>
    <!-- M13d shop overlay shell — hidden by default; managed by ShopView (ADR-0084). -->
    <div id="shop-overlay" style="display:none">
      <div id="shop-title"></div>
      <ul id="shop-for-sale"></ul>
      <ul id="shop-inventory"></ul>
      <div id="shop-feedback"></div>
    </div>
    <!-- m15b trade overlay shell — hidden by default; managed by TradeView (ADR-0107). -->
    <div id="trade-overlay" style="display:none">
      <div id="trade-status"></div>
      <div id="trade-my-side"></div>
      <div id="trade-their-side"></div>
      <div id="trade-actions"></div>
      <div id="trade-feedback"></div>
    </div>
    <!-- m16b PvP challenge overlay shell — hidden by default; managed by PvpView (ADR-0110). -->
    <div id="pvp-challenge-overlay" style="display:none">
      <div id="pvp-challenge-status"></div>
      <div id="pvp-challenge-incoming"></div>
      <div id="pvp-challenge-outgoing"></div>
      <ul id="pvp-player-list"></ul>
      <div id="pvp-challenge-feedback"></div>
    </div>
    <!-- m17b leaderboard overlay shell — hidden by default; managed by LeaderboardView (ADR-0120). -->
    <div id="leaderboard-overlay" style="display:none">
      <div id="leaderboard-title"></div>
      <ul id="leaderboard-list"></ul>
    </div>
    <!-- pt-c1b rename overlay shell — hidden by default; managed by RenameView (ADR-0133). -->
    <div id="rename-overlay" style="display:none">
      <div id="rename-current" data-testid="rename-current"></div>
      <input id="rename-input" data-testid="rename-input" type="text" maxlength="24" />
      <button id="rename-submit" data-testid="rename-submit" type="button">Rename</button>
      <div id="rename-feedback" data-testid="rename-feedback"></div>
    </div>
    <!-- pt-c2 trade-PROPOSE overlay shell — hidden by default; managed by TradeProposeView (ADR-0134). -->
    <div id="tradepropose-overlay" style="display:none">
      <select id="tradepropose-target" data-testid="tradepropose-target"></select>
      <div id="tradepropose-monsters" data-testid="tradepropose-monsters"></div>
      <input
        id="tradepropose-offer-currency"
        data-testid="tradepropose-offer-currency"
        type="number"
        min="0"
      />
      <input
        id="tradepropose-request-currency"
        data-testid="tradepropose-request-currency"
        type="number"
        min="0"
      />
      <button id="tradepropose-submit" data-testid="tradepropose-submit" type="button">
        Offer
      </button>
      <div id="tradepropose-feedback" data-testid="tradepropose-feedback"></div>
    </div>
    <!-- pt-c2b help overlay shell — hidden by default; managed by HelpView (ADR-0135). Display-only.
         ux1 (ADR-0151 D1): viewport-anchored — it used to carry ONLY `display:none`, i.e. a static
         in-flow div AFTER the viewport-tall canvas, so show() painted it below the fold (top=724 at
         innerHeight=720). HelpView writes only `style.display`, so the rest survives a toggle. -->
    <div
      id="help-overlay"
      style="display:none;position:fixed;inset:0;z-index:100;overflow:auto;background:rgba(0,0,0,0.88);padding:24px;font:14px/1.6 monospace;color:#e0e0e0"
    >
      <div id="help-title">Controls &amp; Goals</div>
      <ul id="help-controls"></ul>
      <ul id="help-goals"></ul>
    </div>
    <!-- uxd3 (ADR-0162): main-menu overlay shell — hidden by default; managed by MenuView.
         Carries position:fixed;inset:0;z-index:100 for the SAME reason #help-overlay does
         (ux1 / ADR-0151 D1): a static in-flow div after the viewport-tall canvas paints below
         the fold. MenuView writes only style.display, so the rest survives a toggle.
         inset:0 (not a corner offset) also keeps it out of W-ONE-CORNER-AFFORDANCE's set. -->
    <div
      id="menu-overlay"
      style="display:none;position:fixed;inset:0;z-index:100;overflow:auto;background:rgba(0,0,0,0.88);padding:24px;font:14px/1.6 monospace;color:#e0e0e0"
    >
      <div id="menu-heading"></div>
      <ul id="menu-rows"></ul>
      <div id="menu-back-hint"></div>
    </div>
    <!-- pt-a1 (ADR-0128): build-provenance stamp — populated by main.ts from BUILD_INFO
         (git sha + build time + mode). Non-intrusive; pins which build a playtest finding
         came from. Present in production (unlike the DEV-gated debug hooks). -->
    <div
      id="build-stamp"
      style="position:fixed;bottom:2px;right:4px;font:10px/1.2 monospace;color:#667;opacity:0.55;pointer-events:none;z-index:9999"
    ></div>
    <!-- ux1 (ADR-0151 D2): persistent help affordance — deliberately zero-JS (no view class, no
         main.ts owner), so nothing can hide or remove it. bottom:16px STACKS it above #build-stamp
         (bottom:2px) rather than beside it — measured overlapping at 360px width.
         pointer-events:none is load-bearing: fixed over the canvas, it must not eat clicks. -->
    <div
      id="help-hint"
      style="position:fixed;bottom:16px;left:6px;font:11px/1.3 monospace;color:#9aa0b4;pointer-events:none;z-index:50"
    >
      Press ? for controls &amp; help · M for menu
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
