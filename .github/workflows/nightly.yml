# Nightly mutation + coverage gates (ADR-0050). These are slow / informational
# gates kept OFF the per-PR path so `just ci` stays the fast inner loop
# (ADR-0043). They run on a schedule and on manual dispatch only.
#
# NOTE: all actions are pinned to 40-hex SHAs (M8.5d; the human-readable
# version tag rides as an inline comment). There is deliberately NO
# `continue-on-error` on the threshold steps — a soft failure would make
# these gates toothless.
name: Nightly
on:
  schedule:
    # 07:00 UTC daily.
    - cron: '0 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  # cargo-mutants scoped to the rule core (game-core). Surviving mutants fail
  # the job (default cargo-mutants behavior); policy in ADR-0050.
  # Failure policy for `mutation`: triaged and inserted as the next slice in
  # the milestone queue, same tier as fix-red-master, below it in ordering.
  # Response policy + owner: docs/nightly-red-response-policy.md.
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # v6
      - uses: dtolnay/rust-toolchain@stable # stable
      # Distinct prefix-key (v1-nightly) so this cache never collides with the
      # ci (v1-ci) / e2e (v1-e2e) job caches.
      - uses: Swatinem/rust-cache@v2 # v2
        with: { prefix-key: v1-nightly }
      - uses: taiki-e/install-action@v2 # v2
        with: { tool: cargo-mutants }
      # `just mutate-core` shells out through `just`; without this the step dies
      # with `just: command not found` (exit 127). Same SHA-pin as ci.yml + the
      # coverage job below. cargo-mutants policy is unchanged (ADR-0050).
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      - run: just mutate-core
      # ADR-0200 D7. `if: always()` is LOAD-BEARING, not hygiene: the GitHub
      # default is `success()`, which uploads the survivor list only on the
      # nights it is worthless and skips it on exactly the nights someone needs
      # it to triage. `if-no-files-found: warn` is pinned EXPLICITLY even though
      # `warn` is already the action's default — it is a ratchet against someone
      # raising it to `error`, not an override: at `error` a job that died in the
      # toolchain install, before cargo-mutants ever produced mutants.out/, would
      # report a failing upload step instead of its REAL failure. The artifact
      # name is distinct per job because upload-artifact v4 hard-errors on a
      # duplicate name within one run.
      - name: Upload mutants.out (failure evidence)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutants-out-core
          path: mutants.out/
          if-no-files-found: warn
          retention-days: 14

  # cargo-mutants over the server shell (ADR-0050 amendment A2 / D-13.5-2). The
  # cargo package is `monster-realm-module` (the server-module/ directory's crate
  # name — `-p server-module` fails "Package not found"). Survivor-count RATCHET,
  # not zero-tolerance: the shell's reducers are covered by evals/integration/e2e
  # rather than in-crate units (game-core above keeps zero-tolerance). Baseline
  # 180 missed @ e875af0; cap policy in ADR-0050. Deliberately no soft-failure
  # keys on any step (a soft mutation gate is toothless); wiring + neuter-freedom
  # are guarded by evals/nightly-smoke-wiring.eval.mjs from this job's first commit.
  # Failure policy for `mutation-server`: triaged and inserted as the next
  # slice in the milestone queue, same tier as fix-red-master, below it in
  # ordering.
  # Response policy + owner: docs/nightly-red-response-policy.md.
  mutation-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # v6
      - uses: dtolnay/rust-toolchain@stable # stable
      # Distinct prefix-key (v1-nightly-server) so this cache never collides with
      # the mutation (v1-nightly) / coverage / smoke (v1-smoke) job caches.
      - uses: Swatinem/rust-cache@v2 # v2
        with: { prefix-key: v1-nightly-server }
      - uses: taiki-e/install-action@v2 # v2
        with: { tool: cargo-mutants }
      # cargo-nextest as its own step (matching the sibling jobs' single-tool
      # style): the mutate-server recipe pins --test-tool nextest for determinism
      # with the ADR-0050 recorded baseline, so a missing nextest must fail the
      # install step loudly, not fall back to a different test runner.
      - uses: taiki-e/install-action@v2 # v2
        with: { tool: cargo-nextest }
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      - run: just mutate-server
      # ADR-0200 D7 — same reasoning as the `mutation` job above. `if: always()`
      # is load-bearing: the default `success()` uploads the survivor list only
      # on the nights it is worthless. `warn` is the action's OWN default; pinning
      # it here is a ratchet against a later raise to `error`, which would mask a
      # job that died before cargo-mutants wrote mutants.out/ behind a failing
      # upload step. The name differs from `mutants-out-core` because
      # upload-artifact v4 hard-errors on a duplicate name within one run.
      - name: Upload mutants.out (failure evidence)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutants-out-server
          path: mutants.out/
          if-no-files-found: warn
          retention-days: 14

  # vitest line-coverage threshold (vitest exits non-zero below the threshold).
  # Failure policy for `coverage`: triaged and inserted as the next slice in
  # the milestone queue, same tier as fix-red-master, below it in ordering.
  # Response policy + owner: docs/nightly-red-response-policy.md.
  #
  # Rust + wasm-pack are present because `just coverage` depends on `just wasm`
  # (justfile), exactly as the a11y-e2e job below does: client/src/main.ts imports
  # the gitignored client-wasm pkg, so without it the main.ts-importing specs fail
  # to RESOLVE and vitest emits no coverage report at all — the threshold silently
  # stops being evaluated. Adding the just-dependency WITHOUT these steps would
  # only trade that red for `wasm-pack: command not found`.
  # NOTE: deliberately no `- name: Install client deps` run step (the a11y-e2e job
  # has one): the `coverage:` recipe already runs `npm ci` itself, and a shell step
  # before the gate trips jobIsNotNeutered's "gate must be the FIRST run: step"
  # rule in evals/nightly-smoke-wiring.eval.mjs. `uses:` steps before it are fine.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # v6
      - uses: dtolnay/rust-toolchain@stable # stable
        with: { targets: wasm32-unknown-unknown }
      # Distinct prefix-key (v1-coverage) so this cache never collides with the
      # mutation (v1-nightly) / mutation-server (v1-nightly-server) / smoke
      # (v1-smoke) / a11y (v1-a11y) job caches, or ci.yml's v1-ci / v1-e2e.
      - uses: Swatinem/rust-cache@v2 # v2
        with: { prefix-key: v1-coverage }
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with: { version: 'v0.15.0' }
      - uses: actions/setup-node@v7 # v7
        with:
          node-version: '24.13.1'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      - run: just coverage

  # Publish → edit-content → republish-WITHOUT-delete-data → sync_content →
  # assert data survives + new content version served (spec §12.5b-6, ADR-0079).
  # Failure policy: any failure is inserted as the NEXT slice in the milestone
  # queue (priority: same tier as fix-red-master, below it in ordering).
  # Response policy + owner: docs/nightly-red-response-policy.md.
  # Uses an isolated per-run DB name so concurrent nightly runs don't collide.
  smoke-republish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6 # v6
      - uses: dtolnay/rust-toolchain@stable # stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2 # v2
        with: { prefix-key: v1-smoke }
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      - name: Install SpacetimeDB CLI
        # Download-then-execute (not `curl | sh`): satisfies semgrep
        # gha-curl-pipe-shell and leaves an artifact for inspection.
        # `--yes`: installer prompts to confirm on a non-tty runner without it.
        run: |
          curl -sSf -o /tmp/spacetime-install.sh https://install.spacetimedb.com
          sh /tmp/spacetime-install.sh --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Pin spacetime 2.8.1
        run: |
          spacetime version install 2.8.1
          spacetime version use 2.8.1
          spacetime --version
      # Ephemeral in-memory SpacetimeDB instance on 127.0.0.1:3000.
      - name: Start SpacetimeDB
        run: nohup spacetime start --in-memory --listen-addr 127.0.0.1:3000 > /tmp/stdb-smoke.log 2>&1 &
      - name: Wait for SpacetimeDB
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:3000/; then echo "ready after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "spacetime did not become ready on :3000" >&2
          cat /tmp/stdb-smoke.log >&2 || true
          exit 1
      - name: Run smoke-republish test
        env:
          STDB_SERVER: http://127.0.0.1:3000
          # Per-run isolated DB name: never collides with concurrent nightly runs
          # or the regular monster-realm dev/e2e database.
          MR_SMOKE_DB: monster-realm-smoke-${{ github.run_id }}
        run: just smoke-republish
      - name: Dump SpacetimeDB logs on failure
        if: failure()
        run: cat /tmp/stdb-smoke.log || true

  # Changelog ledger-freshness drift check — ADR-0165's Accepted decision, finally
  # implemented in 13r-g (ADR-0196). Nightly and NOT per-PR by deliberate design: the
  # ledger is allowed to lag by up to one open milestone (ARCHITECTURE.md m17.5g), so a
  # per-PR gate would fire red on essentially every feature PR for a condition that PR did
  # not cause — the nag-then-bypass mode ADR-0165 rejected.
  # The job runs the checker's own test suite first, then the checker. It fails only on a
  # ledger that is BOTH far behind and behind for days (see the threshold provenance in
  # scripts/changelog-freshness.mjs); a healthy mid-milestone wave prints an advisory and
  # exits 0.
  # Failure policy for `changelog-freshness`: triaged and inserted as the next slice in
  # the milestone queue, same tier as fix-red-master, below it in ordering.
  # Response policy + owner: docs/nightly-red-response-policy.md.
  changelog-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # v6
        # `fetch-depth: 0` is load-bearing, not hygiene: at the default depth 1 git-cliff
        # generates a ONE-entry changelog silently and exits 0, which would read as
        # "nothing missing" — a permanently green gate. The script asserts
        # `git rev-parse --is-shallow-repository` at runtime as well, so deleting this
        # line to speed the job up fails loudly instead of going quietly vacuous.
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7 # v7
        # No npm cache: the checker is node-stdlib-only and installs nothing.
        with: { node-version: '24.13.1' }
      # Pinned to the EXACT git-cliff that generated the committed CHANGELOG.md. An
      # unpinned `latest` would let an upstream rendering change flip every entry to
      # missing+extra at once and red this job for a reason unrelated to freshness.
      - uses: taiki-e/install-action@v2 # v2
        with: { tool: git-cliff@2.13.1 }
      # Two separate steps, never one `;`-joined line: a joined command would report only
      # the last exit status and silently discard the suite's result.
      #
      # The TAP pass-count assertion is the SEMANTIC half of the zero-test countermeasure.
      # `node --test <file>` exits 0 when a file defines no tests, and the checker's own
      # floor counts an `it(` STRING — which a block comment containing 60 of them
      # satisfies with zero real tests (demonstrated). Only the runner's own tally proves
      # tests actually executed.
      - name: Gating suite (with a pass-count floor)
        # `shell: bash` for the `-o pipefail` it brings: the default Linux shell is
        # `bash -e` WITHOUT pipefail, so `node --test | tee` would discard node's exit
        # status. The explicit pass/fail parse below is the belt; this is the suspenders.
        shell: bash
        run: |
          node --test --test-reporter=tap scripts/changelog-freshness.test.mjs | tee /tmp/changelog-freshness.tap
          pass=$(sed -n 's/^# pass \([0-9]*\)$/\1/p' /tmp/changelog-freshness.tap | tail -n 1)
          fail=$(sed -n 's/^# fail \([0-9]*\)$/\1/p' /tmp/changelog-freshness.tap | tail -n 1)
          echo "changelog-freshness suite: pass=$pass fail=$fail"
          if [ -z "$pass" ] || [ "$pass" -lt 50 ] || [ "$fail" != "0" ]; then
            echo "changelog-freshness: suite reported pass=$pass fail=$fail — floor is 50 passing, 0 failing" >&2
            exit 1
          fi
      - run: node scripts/changelog-freshness.mjs --check

  # The M23 accessibility decay ratchet (spec §5.7 "CI vs nightly — DECIDED").
  # Nightly and NOT per-PR by deliberate design: `just ci` is fast, hermetic and
  # server-free (ADR-0043), which is exactly why `e2e` is not in it either.
  #
  # WHAT IT ADDS OVER `just ci`, which already runs every a11y eval and every
  # a11y unit spec: decay. `evals/run.mjs` fails only at ZERO eval files, and a
  # MISSING vitest spec reports numTotalTests:0 and exits 0 — both measured — so
  # today an a11y eval or spec can be deleted with the whole per-PR gate staying
  # green. `just a11y-e2e` pins the three a11y evals by name and floors the a11y
  # unit tier's test count. Since rb-19 (ADR-0218) it ALSO runs the axe-core +
  # real-browser tier spec §5.7 named as its payload — `client/e2e/a11y.spec.ts`,
  # three page states scanned against WCAG 2.x A/AA. That is the one lens `just ci`
  # is structurally blind to: source and JSDOM oracles prove an attribute was
  # written, never what the accessibility tree looks like once Chromium has applied
  # CSS and resolved ARIA. The two MANUAL criteria A11Y-32/A11Y-33 are still never
  # asserted here — axe is not a screen reader — and are NEVER CI-green; see
  # docs/a11y-manual-protocol.md.
  #
  # Rust + wasm-pack are present because the recipe depends on `just wasm`:
  # client/src/main.a11yFocus.test.ts imports main.ts, which imports the
  # client-wasm pkg, so without it those 26 tests fail to RESOLVE and the whole
  # M23-S5 focus-return tier drops silently out of the ratchet.
  #
  # SpacetimeDB and a Playwright browser are provisioned because half 3 runs under
  # the default client/playwright.config.ts, whose globalSetup republishes the
  # module: without a live server the axe tier cannot start at all. That server
  # dependency is why this gate is nightly and not in `just ci` (ADR-0043), and why
  # `a11y-e2e` is deliberately absent from the eval's REQUIRED_JUST_STEPS.
  #
  # It is NOT, however, the only place the axe spec runs: playwright.config.ts has
  # `testDir: './e2e'`, so ci.yml's per-PR `e2e:` job collects a11y.spec.ts too
  # (deliberate — ADR-0218). What this job adds over that is the decay ratchet: the
  # `axefloor` assertion notices the spec being DELETED, which a per-PR run cannot.
  # Note the two jobs publish DIFFERENT modules: ci.yml pre-builds a
  # `--features dev_reducers` wasm and publishes it via MR_DEV_MODULE_WASM, while
  # this job leaves that unset so globalSetup takes the plain --module-path path.
  # The axe tier needs no dev reducers, and `smoke-republish` above already proves
  # that publish path nightly with this exact provisioning.
  #
  # Failure policy for `a11y-e2e`: triaged and inserted as the next slice in the
  # milestone queue, same tier as fix-red-master, below it in ordering. Restore
  # the deleted eval or spec; raise the floor only in the commit that
  # deliberately removes a11y tests, never to make a red go away.
  # Response policy + owner: docs/nightly-red-response-policy.md.
  a11y-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # v6
      - uses: dtolnay/rust-toolchain@stable # stable
        with: { targets: wasm32-unknown-unknown }
      # Distinct prefix-key (v1-a11y) so this cache never collides with the
      # mutation (v1-nightly) / mutation-server (v1-nightly-server) / smoke
      # (v1-smoke) job caches, or ci.yml's v1-ci / v1-e2e.
      - uses: Swatinem/rust-cache@v2 # v2
        with: { prefix-key: v1-a11y }
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with: { version: 'v0.15.0' }
      - uses: actions/setup-node@v7 # v7
        with:
          node-version: '24.13.1'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      # `npm ci` lives here rather than inside the recipe so a local
      # `just a11y-e2e` never clobbers a developer's node_modules.
      - name: Install client deps
        run: cd client && npm ci
      - name: Install Playwright chromium
        run: cd client && npx playwright install --with-deps chromium
      # rb-19: half 3 drives a real browser against a real client, and the client's
      # playwright.config.ts globalSetup republishes the module — so this job needs
      # the same SpacetimeDB provisioning ci.yml's `e2e` job and the
      # `smoke-republish` job above carry. Same download-then-execute installer
      # (not `curl | sh`: semgrep gha-curl-pipe-shell), same 2.8.1 pin.
      - name: Install SpacetimeDB CLI
        # `--yes`: the installer prompts to confirm and aborts on a non-tty runner
        # without it. The install also generates the identity keypair used to publish.
        run: |
          curl -sSf -o /tmp/spacetime-install.sh https://install.spacetimedb.com
          sh /tmp/spacetime-install.sh --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Pin spacetime 2.8.1
        run: |
          spacetime version install 2.8.1
          spacetime version use 2.8.1
          spacetime --version
      # Ephemeral in-memory instance on the client's default host/port.
      - name: Start SpacetimeDB
        run: nohup spacetime start --in-memory --listen-addr 127.0.0.1:3000 > /tmp/stdb-a11y.log 2>&1 &
      - name: Wait for SpacetimeDB
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:3000/; then echo "ready after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "spacetime did not become ready on :3000" >&2
          cat /tmp/stdb-a11y.log >&2 || true
          exit 1
      # Deliberately NO continue-on-error and NO if: — a soft-failing decay
      # ratchet is a toothless one. Both are gated by
      # evals/ci-gate-wiring.eval.mjs (a11yNightlyJobIsWired), which also pins
      # this step to exactly one unsuffixed occurrence file-wide. `env:` comes
      # AFTER `run:` on purpose: that check matches the step's trimmed line
      # exactly, and a step whose first key is `env:` reads as zero occurrences.
      # The db name is per-run isolated so it never collides with a concurrent
      # nightly run or with the regular monster-realm dev/e2e database.
      - run: just a11y-e2e
        env:
          STDB_SERVER: http://127.0.0.1:3000
          VITE_STDB_URI: ws://127.0.0.1:3000
          VITE_STDB_DB: monster-realm-a11y-${{ github.run_id }}
          MR_E2E_PORT: '5292'
      # ADR-0200 D7, same reasoning as the mutation jobs: `if: always()` is
      # load-bearing, not hygiene. The GitHub default is `success()`, which
      # uploads the vitest report only on the nights it is worthless and skips
      # it on exactly the nights someone needs it to see WHICH spec vanished.
      # `if-no-files-found: warn` is pinned explicitly as a ratchet against a
      # later raise to `error`: at `error`, a job that died in `just wasm` before
      # vitest ever ran would report a failing upload step instead of its REAL
      # failure. The artifact name is distinct per job (upload-artifact v4
      # hard-errors on a duplicate name within one run).
      # A publish failure inside globalSetup, or a client that connects but never
      # reaches ready(), reds this job with nothing to look at otherwise — the same
      # reasoning smoke-republish's log dump carries.
      - name: Dump SpacetimeDB logs on failure
        if: failure()
        run: cat /tmp/stdb-a11y.log || true
      - name: Upload a11y vitest report (failure evidence)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a11y-e2e-vitest-report
          # BOTH halves' reports. Half 3 writes the axe one, and a nightly red IN
          # the axe tier shipped no evidence at all until it was listed here — the
          # exact gap `if: always()` exists to close for half 2.
          path: |
            /tmp/a11y-e2e-vitest.json
            /tmp/a11y-e2e-axe.json
          if-no-files-found: warn
          retention-days: 14

  # Failure NOTIFICATION fan-in (ADR-0200). The five gates above had teeth and no
  # voice: `mutation-server` was RED for five consecutive nights with nobody
  # reacting, because failure handling existed only as the prose triage comments
  # above each job. This job is that voice.
  #
  # Failure policy for `notify`: a failure here means the notifier itself is
  # broken (a 403 on the API call, a malformed jq filter, or the D6 zero-guard
  # firing) — triaged and inserted as the next slice in the milestone queue, same
  # tier as fix-red-master, below it in ordering. There is deliberately NO
  # `continue-on-error` and no `|| true`: a notifier that swallows its own errors
  # is indistinguishable from a green night, which is the exact bug being fixed.
  # Response policy + owner: docs/nightly-red-response-policy.md.
  #
  # D2a — the condition admits THREE non-success results, not just `failure()`.
  # GitHub evaluates `failure()` true only when a needed job actually FAILED, so a
  # job neutered into `skipped` would leave this job skipped too, reproducing "red
  # and silent" one level up. `cancelled` is the third term because a
  # `timeout-minutes` expiry concludes the job as CANCELLED, satisfying neither
  # `failure` nor `skipped`: `smoke-republish` carries a 20-minute timeout and the
  # mutation jobs run 1.5-2.5 h against the 6 h hosted cap, so that is a real
  # red-and-silent night, not a hypothetical one.
  # The leading `!cancelled()` is a different predicate from the
  # `contains(needs.*.result, 'cancelled')` term and still does what it always did:
  # `cancelled()` is true only when the WHOLE RUN was cancelled (someone hit Cancel,
  # or a newer run superseded this one), which is a human action needing no issue —
  # whereas a single needed job concluding `cancelled` leaves the run itself
  # uncancelled and must be reported. It also keeps the job quiet on a fully green
  # night, so D6's zero-guard cannot misfire.
  #
  # D3 — the `issues: write` grant is JOB-scoped. Top-level `permissions:` stays
  # `contents: read`, so the mutation jobs, which compile third-party build
  # scripts under cargo-mutants, never hold issue-write.
  #
  # D1/D5 — `gh` (preinstalled on ubuntu-latest) rather than a third-party
  # notification Action: nothing extra to pin, trust or renovate, and a 403 exits
  # non-zero and REDs the job loudly. Every `${{ }}` value is passed through
  # `env:` and referenced as `$VAR`, never interpolated into the script body.
  # No `--label`: `gh issue create --label X` fails the API call when X does not
  # exist in the repo (D4), which would convert the notification back into a
  # silent-failure surface.
  notify:
    needs: [mutation, mutation-server, coverage, smoke-republish, changelog-freshness, a11y-e2e]
    if: ${{ !cancelled() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open one issue per non-success job
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `gh` resolves the target repo from the current git remote, and this
          # job deliberately has no checkout step — without GH_REPO every
          # `gh issue create` dies with "not a git repository".
          GH_REPO: ${{ github.repository }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        # `shell: bash` for the `-o pipefail` it brings, the same discipline the
        # `changelog-freshness` job documents: the default Linux shell is `bash -e`
        # WITHOUT pipefail, and were it ever to fall back to `sh -e {0}` the
        # `set -o pipefail` below would itself error out.
        shell: bash
        run: |
          set -euo pipefail
          # D2: the failing set is ENUMERATED from toJSON(needs), never hardcoded —
          # five hardcoded needs.<job>.result branches would silently drop the sixth
          # job the day someone adds one. Selecting non-success (rather than
          # == "failure") also reports a `skipped` job, which is what a successful
          # job-level neuter looks like at runtime.
          #
          # The enumeration is CAPTURED INTO A VARIABLE first, never inlined as
          # `for job in $(jq …)`: a command substitution in a `for` list is
          # `set -e`-EXEMPT, so a malformed NEEDS_JSON or a missing jq would yield
          # zero iterations and then be laundered into D6's "enumerated zero
          # non-success jobs" message — reporting the wrong cause for the red. An
          # assignment DOES trip `set -e`, so the notifier fails on its real error.
          failed_jobs=$(printf '%s' "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result != "success") | .key')
          opened=0
          for job in $failed_jobs; do
            result=$(printf '%s' "$NEEDS_JSON" | jq -r --arg j "$job" '.[$j].result')
            gh issue create --title "nightly failure: $job (run $RUN_ID)" --body "Nightly job $job finished with result $result. Run: $RUN_URL"
            # An assignment, NOT a bare `$((opened + 1))` command: under
            # `set -euo pipefail` a bare arithmetic expansion evaluating to 0
            # exits non-zero and would abort the loop on the very first issue.
            opened=$((opened + 1))
          done
          # D6: a notification path that runs and quietly creates nothing is
          # indistinguishable from a green night — the failure mode being fixed.
          if [ "$opened" -eq 0 ]; then
            echo "notify fired but enumerated zero non-success jobs: $NEEDS_JSON" >&2
            exit 1
          fi
