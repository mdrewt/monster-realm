# Slow gates kept off the PR path (see CONTRIBUTING.md for what a red night asks of you);
# `notify` keeps one open issue per non-success job.
name: Nightly
on:
  schedule:
    # Off minute 0: GitHub delays scheduled runs most at the top of the hour.
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  # game-core, zero tolerance. Sharded (cargo-mutants `--shard k/n`, 0-based) because the crate's
  # mutants no longer fit one serial job under GitHub's 6 h cap (nights of 2026-10-31,
  # 11-01 and 11-04 were cancelled at exactly 6 h); every shard is its own zero-tolerance verdict,
  # so the job is red iff any shard is. Keep the matrix length equal to the `/n` in `shard`.
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: ['0/6', '1/6', '2/6', '3/6', '4/6', '5/6']
    steps:
      - uses: actions/checkout@v6 # v6
      - uses: dtolnay/rust-toolchain@stable # stable
      - uses: Swatinem/rust-cache@v2 # v2
        with: { prefix-key: v1-nightly }
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with: { tool: cargo-mutants@27.1.0 }
      - uses: ./.github/actions/tools
      - run: just mutate-core ${{ matrix.shard }}
      # always(): the survivor list matters most on the nights the gate fails.
      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutants-out-core-${{ strategy.job-index }}
          path: mutants.out/
          if-no-files-found: warn
          retention-days: 14

  # server-module mutation gate, zero tolerance like game-core. Sharded for the same 6 h reason as
  # `mutation` (~1500 mutants, ~5 h serial on 2026-10-31 and growing); every shard is its own verdict
  # and the job is red iff any shard is. Keep the matrix length equal to the `/n` in `shard`.
  mutation-server:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: ['0/8', '1/8', '2/8', '3/8', '4/8', '5/8', '6/8', '7/8']
    steps:
      - uses: actions/checkout@v6 # v6
      - uses: dtolnay/rust-toolchain@stable # stable
      - uses: Swatinem/rust-cache@v2 # v2
        with: { prefix-key: v1-nightly-server }
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with: { tool: cargo-mutants@27.1.0 }
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with: { tool: cargo-nextest@0.9.148 }
      - uses: ./.github/actions/tools
      - run: just mutate-server ${{ matrix.shard }}
      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutants-out-server-${{ strategy.job-index }}
          path: mutants.out/
          if-no-files-found: warn
          retention-days: 14

  # Client line coverage, report-only. Rust + wasm-pack because `just coverage` builds the wasm pkg.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # v6
      - uses: dtolnay/rust-toolchain@stable # stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2 # v2
        with: { prefix-key: v1-coverage }
      - uses: actions/setup-node@v7 # v7
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: ./.github/actions/tools
        with: { wasm: true }
      - run: just coverage
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-summary
          path: client/coverage/
          if-no-files-found: warn
          retention-days: 14

  # game-core hot-path criterion budgets.
  perf-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # v6
      - uses: dtolnay/rust-toolchain@stable # stable
      - uses: Swatinem/rust-cache@v2 # v2
        with: { prefix-key: v1-perf }
      - uses: ./.github/actions/tools
      - run: just perf-budget

  # The whole e2e suite in ONE Playwright process on ONE database. CI runs it as shards with a
  # database each, so there a spec's exact live-population assertion sees only the files of its own
  # shard; here it sees every earlier file, which is what catches a player one file leaves joined.
  e2e-serial:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6 # v6
      - uses: dtolnay/rust-toolchain@stable # stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2 # v2
        with: { prefix-key: v1-e2e }
      - uses: actions/setup-node@v7 # v7
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: ./.github/actions/tools
        with: { wasm: true }
      - name: Build dev_reducers module wasm
        run: cargo build -p monster-realm-module --release --target wasm32-unknown-unknown --features dev_reducers
      - name: Start SpacetimeDB
        run: nohup spacetime start --in-memory --listen-addr 127.0.0.1:3000 > /tmp/stdb-e2e.log 2>&1 &
      - name: Wait for SpacetimeDB
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:3000/; then echo "ready after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "spacetime did not become ready on :3000" >&2; cat /tmp/stdb-e2e.log >&2 || true; exit 1
      - name: Install client deps
        run: cd client && npm ci
      # Keyed on the lock file, which fixes the Playwright version and so the chromium build:
      # on a hit the install step below finds the browser present and downloads nothing.
      - uses: actions/cache@v6 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}
      - name: Install Playwright chromium
        run: cd client && npx playwright install chromium
      - name: Whole e2e suite, one process
        env:
          STDB_SERVER: http://127.0.0.1:3000
          VITE_STDB_URI: ws://127.0.0.1:3000
          VITE_STDB_DB: monster-realm
          MR_DEV_MODULE_WASM: ${{ github.workspace }}/target/wasm32-unknown-unknown/release/monster_realm_module.wasm
        run: just e2e

  # Republish over live data without --delete-data; data must survive and re-seed.
  smoke-republish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6 # v6
      - uses: dtolnay/rust-toolchain@stable # stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2 # v2
        with: { prefix-key: v1-smoke }
      - uses: ./.github/actions/tools
      - name: Start SpacetimeDB
        run: nohup spacetime start --in-memory --listen-addr 127.0.0.1:3000 > /tmp/stdb-smoke.log 2>&1 &
      - name: Wait for SpacetimeDB
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:3000/; then echo "ready after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "spacetime did not become ready on :3000" >&2
          cat /tmp/stdb-smoke.log >&2 || true
          exit 1
      - name: Run smoke-republish test
        env:
          STDB_SERVER: http://127.0.0.1:3000
          MR_SMOKE_DB: monster-realm-smoke-${{ github.run_id }}
        run: just smoke-republish
      - name: Dump SpacetimeDB logs on failure
        if: failure()
        run: cat /tmp/stdb-smoke.log || true

  # One open issue per failed, skipped or cancelled job: a job that is still red the next night
  # gets a comment on its open issue, not a second issue. A job that times out concludes
  # `cancelled`; `!cancelled()` only suppresses a whole-run cancel. No soft-fail anywhere: a
  # notifier that swallows its errors looks like a green night. Default branch only: a manual run on
  # another branch reports through its own run page, not the issue tracker.
  notify:
    needs: [mutation, mutation-server, coverage, perf-budget, e2e-serial, smoke-republish]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update one issue per non-success job
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          # Assigned first: a failing command substitution in a `for` list would be set -e-exempt.
          failed_jobs=$(printf '%s' "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result != "success") | .key')
          opened=0
          for job in $failed_jobs; do
            result=$(printf '%s' "$NEEDS_JSON" | jq -r --arg j "$job" '.[$j].result')
            body="Nightly job $job finished with result $result. Run: $RUN_URL"
            # Newest open issue for this job; the trailing " (" keeps `mutation` from matching `mutation-server`.
            existing=$(gh issue list --state open --limit 500 --json number,title \
              | jq -r --arg p "nightly failure: $job (" '[.[] | select(.title | startswith($p))][0].number // empty')
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "$body"
            else
              gh issue create --title "nightly failure: $job (run $RUN_ID)" --body "$body"
            fi
            opened=$((opened + 1))
          done
          if [ "$opened" -eq 0 ]; then
            echo "notify fired but enumerated zero non-success jobs: $NEEDS_JSON" >&2
            exit 1
          fi
