# Slow gates kept off the PR path (see CONTRIBUTING.md for what a red night asks of you);
# `notify` opens one issue per non-success job.
name: Nightly
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  # game-core, zero tolerance. Sharded (cargo-mutants `--shard k/n`, 0-based) because the crate's
  # 2052 mutants no longer fit one serial job under GitHub's 6 h cap (nights of 2026-10-31,
  # 11-01 and 11-04 were cancelled at exactly 6 h); every shard is its own zero-tolerance verdict,
  # so the job is red iff any shard is. Keep the matrix length equal to the `/n` in `shard`.
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: ['0/6', '1/6', '2/6', '3/6', '4/6', '5/6']
    steps:
      - uses: actions/checkout@v6 # v6
      - uses: dtolnay/rust-toolchain@stable # stable
      - uses: Swatinem/rust-cache@v2 # v2
        with: { prefix-key: v1-nightly }
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with: { tool: cargo-mutants@27.1.0 }
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with: { just-version: '1.58.0' }
      - run: just mutate-core ${{ matrix.shard }}
      # always(): the survivor list matters most on the nights the gate fails.
      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutants-out-core-${{ strategy.job-index }}
          path: mutants.out/
          if-no-files-found: warn
          retention-days: 14

  # server-module mutation gate, zero tolerance like game-core. Sharded for the same 6 h
  # reason as `mutation` (1532 mutants, ~5 h serial on 2026-10-31 and growing); a shard only runs
  # and reports its survivors, `mutation-server` below checks all shards for zero survivors.
  mutation-server-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: ['0/8', '1/8', '2/8', '3/8', '4/8', '5/8', '6/8', '7/8']
    steps:
      - uses: actions/checkout@v6 # v6
      - uses: dtolnay/rust-toolchain@stable # stable
      - uses: Swatinem/rust-cache@v2 # v2
        with: { prefix-key: v1-nightly-server }
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with: { tool: cargo-mutants@27.1.0 }
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with: { tool: cargo-nextest@0.9.148 }
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with: { just-version: '1.58.0' }
      - run: just mutate-server ${{ matrix.shard }}
      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutants-out-server-${{ strategy.job-index }}
          path: mutants.out/
          if-no-files-found: warn
          retention-days: 14

  # The aggregate: zero survivors over ALL shards. `!cancelled()` so it
  # still judges when one shard failed; the recipe fails if a shard's missed.txt is absent.
  # Keep `shards` equal to the length of the matrix above.
  mutation-server:
    needs: [mutation-server-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # A shard that was cancelled or timed out leaves a partial missed.txt that would under-count.
      - name: Every shard must have succeeded
        env:
          SHARDS: ${{ needs.mutation-server-shard.result }}
        run: |
          test "$SHARDS" = success || { echo "mutation-server-shard result is $SHARDS" >&2; exit 1; }
      - uses: actions/checkout@v6 # v6
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with: { just-version: '1.58.0' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mutants-out-server-*
          path: shard-out
      - run: just mutate-server-check shard-out 8

  # Client line coverage, report-only. Rust + wasm-pack because `just coverage` builds the wasm pkg.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # v6
      - uses: dtolnay/rust-toolchain@stable # stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2 # v2
        with: { prefix-key: v1-coverage }
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with: { version: 'v0.15.0' }
      - uses: actions/setup-node@v7 # v7
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with: { just-version: '1.58.0' }
      - run: just coverage
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-summary
          path: client/coverage/
          if-no-files-found: warn
          retention-days: 14

  # game-core hot-path criterion budgets.
  perf-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # v6
      - uses: dtolnay/rust-toolchain@stable # stable
      - uses: Swatinem/rust-cache@v2 # v2
        with: { prefix-key: v1-perf }
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with: { just-version: '1.58.0' }
      - run: just perf-budget

  # Republish over live data without --delete-data; data must survive and re-seed.
  smoke-republish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6 # v6
      - uses: dtolnay/rust-toolchain@stable # stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2 # v2
        with: { prefix-key: v1-smoke }
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with: { just-version: '1.58.0' }
      - name: Install SpacetimeDB CLI
        run: |
          curl -sSf -o /tmp/spacetime-install.sh https://install.spacetimedb.com
          sh /tmp/spacetime-install.sh --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Pin spacetime 2.11.0
        run: |
          spacetime version install 2.11.0
          spacetime version use 2.11.0
          spacetime --version
      - name: Start SpacetimeDB
        run: nohup spacetime start --in-memory --listen-addr 127.0.0.1:3000 > /tmp/stdb-smoke.log 2>&1 &
      - name: Wait for SpacetimeDB
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:3000/; then echo "ready after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "spacetime did not become ready on :3000" >&2
          cat /tmp/stdb-smoke.log >&2 || true
          exit 1
      - name: Run smoke-republish test
        env:
          STDB_SERVER: http://127.0.0.1:3000
          MR_SMOKE_DB: monster-realm-smoke-${{ github.run_id }}
        run: just smoke-republish
      - name: Dump SpacetimeDB logs on failure
        if: failure()
        run: cat /tmp/stdb-smoke.log || true

  # One issue per failed, skipped or cancelled job. A job that times out concludes
  # `cancelled`; `!cancelled()` only suppresses a whole-run cancel. No soft-fail anywhere: a
  # notifier that swallows its errors looks like a green night.
  notify:
    needs: [mutation, mutation-server, coverage, perf-budget, smoke-republish]
    if: ${{ !cancelled() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open one issue per non-success job
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          # Assigned first: a failing command substitution in a `for` list would be set -e-exempt.
          failed_jobs=$(printf '%s' "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result != "success") | .key')
          opened=0
          for job in $failed_jobs; do
            result=$(printf '%s' "$NEEDS_JSON" | jq -r --arg j "$job" '.[$j].result')
            gh issue create --title "nightly failure: $job (run $RUN_ID)" --body "Nightly job $job finished with result $result. Run: $RUN_URL"
            opened=$((opened + 1))
          done
          if [ "$opened" -eq 0 ]; then
            echo "notify fired but enumerated zero non-success jobs: $NEEDS_JSON" >&2
            exit 1
          fi
