# Slow gates kept off the PR path (see CONTRIBUTING.md for what a red night asks of you);
# `notify` keeps one open issue per non-success job. The weekly schedule runs only the full
# server-module mutation sweep, whose survivors fail nothing: it reports them as one issue.
name: Nightly
on:
  schedule:
    # Off minute 0: GitHub delays scheduled runs most at the top of the hour.
    - cron: '17 7 * * *'
    # Weekly. Every job's `if:` names this exact string to tell the two schedules apart.
    - cron: '41 3 * * 0'
  workflow_dispatch:
    inputs:
      suite:
        description: 'nightly: the nightly jobs; server-mutation-sweep: the weekly sweep'
        type: choice
        options: [nightly, server-mutation-sweep]
        default: nightly
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  # game-core, zero tolerance. Sharded (cargo-mutants `--shard k/n`, 0-based) because the crate's
  # mutants no longer fit one serial job under GitHub's 6 h cap (nights of 2026-10-31,
  # 11-01 and 11-04 were cancelled at exactly 6 h); every shard is its own zero-tolerance verdict,
  # so the job is red iff any shard is. Keep the matrix length equal to the `/n` in `shard`.
  mutation:
    if: github.event.schedule != '41 3 * * 0' && inputs.suite != 'server-mutation-sweep'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: ['0/6', '1/6', '2/6', '3/6', '4/6', '5/6']
    steps:
      - uses: actions/checkout@v6 # v6
      - uses: dtolnay/rust-toolchain@stable # stable
      - uses: Swatinem/rust-cache@v2 # v2
        with: { prefix-key: v1-nightly }
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with: { tool: cargo-mutants@27.1.0 }
      - uses: ./.github/actions/tools
      - run: just mutate-core ${{ matrix.shard }}
      # always(): the survivor list matters most on the nights the gate fails.
      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutants-out-core-${{ strategy.job-index }}
          path: mutants.out/
          if-no-files-found: warn
          retention-days: 14

  # The full server-module mutation sweep, weekly: a report, not a gate (the server's gate is the
  # pull request's `mutation-diff`). Sharded for the same 6 h reason as `mutation` (~2100 mutants);
  # a shard is red only when cargo-mutants gave no verdict.
  # Keep the matrix length equal to the `/n` in `shard`.
  mutation-server:
    if: github.event.schedule == '41 3 * * 0' || inputs.suite == 'server-mutation-sweep'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: ['0/8', '1/8', '2/8', '3/8', '4/8', '5/8', '6/8', '7/8']
    steps:
      - uses: actions/checkout@v6 # v6
      - uses: dtolnay/rust-toolchain@stable # stable
      - uses: Swatinem/rust-cache@v2 # v2
        with: { prefix-key: v1-nightly-server }
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with: { tool: cargo-mutants@27.1.0 }
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with: { tool: cargo-nextest@0.9.148 }
      - uses: ./.github/actions/tools
      - run: just mutate-server ${{ matrix.shard }}
      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutants-out-server-${{ strategy.job-index }}
          path: mutants.out/
          if-no-files-found: warn
          retention-days: 14

  # The sweep's survivors as ONE issue: a comment on the open report issue, else a new one; nothing
  # is filed when there are none and every shard gave a verdict. Only a run on the default branch
  # files; a run on any other branch prints what it would file (a dry run).
  mutation-server-report:
    needs: [mutation-server]
    if: ${{ !cancelled() && needs.mutation-server.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mutants-out-server-*
          path: shards
      - name: File the survivors as one issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          SWEEP_RESULT: ${{ needs.mutation-server.result }}
          FILE_ISSUE: ${{ github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          lists=(shards/*/missed.txt)
          sort /dev/null ${lists[@]+"${lists[@]}"} > survivors.txt
          count=$(grep -c '' survivors.txt || true)
          title="weekly server mutation report"
          {
            echo "The weekly server-module mutation sweep left $count surviving mutant(s), from ${#lists[@]} shard list(s). Run: $RUN_URL"
            if [ "$SWEEP_RESULT" != success ]; then
              echo
              echo "The sweep finished $SWEEP_RESULT: a shard without a verdict listed nothing, so the list may be short."
            fi
            echo
            echo "Each survivor is a candidate, not a work item: CONTRIBUTING.md says when one is worth a test."
            echo
            # Four backticks: a mutant name quotes source, which may hold a three-backtick run.
            echo '````'
            if [ "$(wc -c < survivors.txt)" -gt 60000 ]; then
              # Under GitHub's 65536-character body cap; the cut drops the partial last line.
              head -c 60000 survivors.txt | sed '$d'
              echo '````'
              echo "The list is cut at 60000 bytes; the run's mutants-out-server-* artifacts hold all of it."
            else
              cat survivors.txt
              echo '````'
            fi
          } > body.md
          if [ "$count" -eq 0 ] && [ "$SWEEP_RESULT" = success ]; then
            echo "No survivors and every shard gave a verdict: nothing to file."
            exit 0
          fi
          if [ "$FILE_ISSUE" != true ]; then
            echo "Dry run (not the default branch). Would file under \"$title\":"
            cat body.md
            exit 0
          fi
          existing=$(gh issue list --state open --limit 500 --json number,title \
            | jq -r --arg p "$title (run " '[.[] | select(.title | startswith($p))][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title (run $RUN_ID)" --body-file body.md
          fi

  # Client line coverage, report-only. Rust + wasm-pack because `just coverage` builds the wasm pkg.
  coverage:
    if: github.event.schedule != '41 3 * * 0' && inputs.suite != 'server-mutation-sweep'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # v6
      - uses: dtolnay/rust-toolchain@stable # stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2 # v2
        with: { prefix-key: v1-coverage }
      - uses: actions/setup-node@v7 # v7
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: ./.github/actions/tools
        with: { wasm: true }
      - run: just coverage
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-summary
          path: client/coverage/
          if-no-files-found: warn
          retention-days: 14

  # game-core hot-path criterion budgets.
  perf-budget:
    if: github.event.schedule != '41 3 * * 0' && inputs.suite != 'server-mutation-sweep'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # v6
      - uses: dtolnay/rust-toolchain@stable # stable
      - uses: Swatinem/rust-cache@v2 # v2
        with: { prefix-key: v1-perf }
      - uses: ./.github/actions/tools
      - run: just perf-budget

  # The whole e2e suite in ONE Playwright process on ONE database. CI runs it as shards with a
  # database each, so there a spec's exact live-population assertion sees only the files of its own
  # shard; here it sees every earlier file, which is what catches a player one file leaves joined.
  e2e-serial:
    if: github.event.schedule != '41 3 * * 0' && inputs.suite != 'server-mutation-sweep'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6 # v6
      - uses: dtolnay/rust-toolchain@stable # stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2 # v2
        with: { prefix-key: v1-e2e }
      - uses: actions/setup-node@v7 # v7
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: ./.github/actions/tools
        with: { wasm: true }
      - name: Build dev_reducers module wasm
        run: cargo build -p monster-realm-module --release --target wasm32-unknown-unknown --features dev_reducers
      - name: Start SpacetimeDB
        run: nohup spacetime start --in-memory --listen-addr 127.0.0.1:3000 > /tmp/stdb-e2e.log 2>&1 &
      - name: Wait for SpacetimeDB
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:3000/; then echo "ready after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "spacetime did not become ready on :3000" >&2; cat /tmp/stdb-e2e.log >&2 || true; exit 1
      - name: Install client deps
        run: cd client && npm ci
      # Keyed on the lock file, which fixes the Playwright version and so the chromium build:
      # on a hit the install step below finds the browser present and downloads nothing.
      - uses: actions/cache@v6 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}
      - name: Install Playwright chromium
        run: cd client && npx playwright install chromium
      - name: Whole e2e suite, one process
        env:
          STDB_SERVER: http://127.0.0.1:3000
          VITE_STDB_URI: ws://127.0.0.1:3000
          VITE_STDB_DB: monster-realm
          MR_DEV_MODULE_WASM: ${{ github.workspace }}/target/wasm32-unknown-unknown/release/monster_realm_module.wasm
        run: just e2e

  # Republish over live data without --delete-data; data must survive and re-seed.
  smoke-republish:
    if: github.event.schedule != '41 3 * * 0' && inputs.suite != 'server-mutation-sweep'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6 # v6
      - uses: dtolnay/rust-toolchain@stable # stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2 # v2
        with: { prefix-key: v1-smoke }
      - uses: ./.github/actions/tools
      - name: Start SpacetimeDB
        run: nohup spacetime start --in-memory --listen-addr 127.0.0.1:3000 > /tmp/stdb-smoke.log 2>&1 &
      - name: Wait for SpacetimeDB
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:3000/; then echo "ready after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "spacetime did not become ready on :3000" >&2
          cat /tmp/stdb-smoke.log >&2 || true
          exit 1
      - name: Run smoke-republish test
        env:
          STDB_SERVER: http://127.0.0.1:3000
          MR_SMOKE_DB: monster-realm-smoke-${{ github.run_id }}
        run: just smoke-republish
      - name: Dump SpacetimeDB logs on failure
        if: failure()
        run: cat /tmp/stdb-smoke.log || true

  # The load driver for a few seconds: the default module build on a fresh in-memory host, one
  # level of 20 bots (`just load-smoke`). Red when the driver fails, the ramp aborts or the level is
  # invalid; the log's last driver line names each invalid level as <concurrency>:<reason>.
  load-smoke:
    if: github.event.schedule != '41 3 * * 0' && inputs.suite != 'server-mutation-sweep'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MR_LOAD_DB: monster-realm-load
    steps:
      - uses: actions/checkout@v6 # v6
      - uses: dtolnay/rust-toolchain@stable # stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2 # v2
        with: { prefix-key: v1-load-smoke }
      - uses: ./.github/actions/tools
      - name: Start SpacetimeDB
        run: nohup spacetime start --in-memory --listen-addr 127.0.0.1:3000 > /tmp/stdb-load.log 2>&1 &
      - name: Wait for SpacetimeDB
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:3000/; then echo "ready after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "spacetime did not become ready on :3000" >&2
          cat /tmp/stdb-load.log >&2 || true
          exit 1
      - name: Publish the default module
        run: spacetime publish -s http://127.0.0.1:3000 --module-path server-module -y "$MR_LOAD_DB"
      - run: just load-smoke
      - name: Dump SpacetimeDB logs on failure
        if: failure()
        run: cat /tmp/stdb-load.log || true

  # One open issue per failed, skipped or cancelled job: a job that is still red the next night
  # gets a comment on its open issue, not a second issue. A job that times out concludes
  # `cancelled`; `!cancelled()` only suppresses a whole-run cancel. No soft-fail anywhere: a
  # notifier that swallows its errors looks like a green night. Default branch only: a manual run on
  # another branch reports through its own run page, not the issue tracker. Not on a sweep run, where
  # every job it needs is skipped by design.
  notify:
    needs: [mutation, coverage, perf-budget, e2e-serial, smoke-republish, load-smoke]
    if: ${{ !cancelled() && github.event.schedule != '41 3 * * 0' && inputs.suite != 'server-mutation-sweep' && (github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update one issue per non-success job
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          # Assigned first: a failing command substitution in a `for` list would be set -e-exempt.
          failed_jobs=$(printf '%s' "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result != "success") | .key')
          opened=0
          for job in $failed_jobs; do
            result=$(printf '%s' "$NEEDS_JSON" | jq -r --arg j "$job" '.[$j].result')
            body="Nightly job $job finished with result $result. Run: $RUN_URL"
            # Newest open issue for this job; the trailing " (" keeps `mutation` from matching `mutation-server`.
            existing=$(gh issue list --state open --limit 500 --json number,title \
              | jq -r --arg p "nightly failure: $job (" '[.[] | select(.title | startswith($p))][0].number // empty')
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "$body"
            else
              gh issue create --title "nightly failure: $job (run $RUN_ID)" --body "$body"
            fi
            opened=$((opened + 1))
          done
          if [ "$opened" -eq 0 ]; then
            echo "notify fired but enumerated zero non-success jobs: $NEEDS_JSON" >&2
            exit 1
          fi
