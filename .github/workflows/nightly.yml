# Nightly mutation + coverage gates (ADR-0050). These are slow / informational
# gates kept OFF the per-PR path so `just ci` stays the fast inner loop
# (ADR-0043). They run on a schedule and on manual dispatch only.
#
# NOTE: all actions are pinned to 40-hex SHAs (M8.5d; the human-readable
# version tag rides as an inline comment). There is deliberately NO
# `continue-on-error` on the threshold steps — a soft failure would make
# these gates toothless.
name: Nightly
on:
  schedule:
    # 07:00 UTC daily.
    - cron: '0 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # cargo-mutants scoped to the rule core (game-core). Surviving mutants fail
  # the job (default cargo-mutants behavior); policy in ADR-0050.
  # Failure policy for `mutation`: triaged and inserted as the next slice in
  # the milestone queue, same tier as fix-red-master, below it in ordering.
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      # Distinct prefix-key (v1-nightly) so this cache never collides with the
      # ci (v1-ci) / e2e (v1-e2e) job caches.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with: { prefix-key: v1-nightly }
      - uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2
        with: { tool: cargo-mutants }
      # `just mutate-core` shells out through `just`; without this the step dies
      # with `just: command not found` (exit 127). Same SHA-pin as ci.yml + the
      # coverage job below. cargo-mutants policy is unchanged (ADR-0050).
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      - run: just mutate-core

  # cargo-mutants over the server shell (ADR-0050 amendment A2 / D-13.5-2). The
  # cargo package is `monster-realm-module` (the server-module/ directory's crate
  # name — `-p server-module` fails "Package not found"). Survivor-count RATCHET,
  # not zero-tolerance: the shell's reducers are covered by evals/integration/e2e
  # rather than in-crate units (game-core above keeps zero-tolerance). Baseline
  # 180 missed @ e875af0; cap policy in ADR-0050. Deliberately no soft-failure
  # keys on any step (a soft mutation gate is toothless); wiring + neuter-freedom
  # are guarded by evals/nightly-smoke-wiring.eval.mjs from this job's first commit.
  # Failure policy for `mutation-server`: triaged and inserted as the next
  # slice in the milestone queue, same tier as fix-red-master, below it in
  # ordering.
  mutation-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      # Distinct prefix-key (v1-nightly-server) so this cache never collides with
      # the mutation (v1-nightly) / coverage / smoke (v1-smoke) job caches.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with: { prefix-key: v1-nightly-server }
      - uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2
        with: { tool: cargo-mutants }
      # cargo-nextest as its own step (matching the sibling jobs' single-tool
      # style): the mutate-server recipe pins --test-tool nextest for determinism
      # with the ADR-0050 recorded baseline, so a missing nextest must fail the
      # install step loudly, not fall back to a different test runner.
      - uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2
        with: { tool: cargo-nextest }
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      - run: just mutate-server

  # vitest line-coverage threshold (vitest exits non-zero below the threshold).
  # Failure policy for `coverage`: triaged and inserted as the next slice in
  # the milestone queue, same tier as fix-red-master, below it in ordering.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.13.1'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      - run: just coverage

  # Publish → edit-content → republish-WITHOUT-delete-data → sync_content →
  # assert data survives + new content version served (spec §12.5b-6, ADR-0079).
  # Failure policy: any failure is inserted as the NEXT slice in the milestone
  # queue (priority: same tier as fix-red-master, below it in ordering).
  # Uses an isolated per-run DB name so concurrent nightly runs don't collide.
  smoke-republish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with: { prefix-key: v1-smoke }
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      - name: Install SpacetimeDB CLI
        # Download-then-execute (not `curl | sh`): satisfies semgrep
        # gha-curl-pipe-shell and leaves an artifact for inspection.
        # `--yes`: installer prompts to confirm on a non-tty runner without it.
        run: |
          curl -sSf -o /tmp/spacetime-install.sh https://install.spacetimedb.com
          sh /tmp/spacetime-install.sh --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Pin spacetime 2.8.1
        run: |
          spacetime version install 2.8.1
          spacetime version use 2.8.1
          spacetime --version
      # Ephemeral in-memory SpacetimeDB instance on 127.0.0.1:3000.
      - name: Start SpacetimeDB
        run: nohup spacetime start --in-memory --listen-addr 127.0.0.1:3000 > /tmp/stdb-smoke.log 2>&1 &
      - name: Wait for SpacetimeDB
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:3000/; then echo "ready after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "spacetime did not become ready on :3000" >&2
          cat /tmp/stdb-smoke.log >&2 || true
          exit 1
      - name: Run smoke-republish test
        env:
          STDB_SERVER: http://127.0.0.1:3000
          # Per-run isolated DB name: never collides with concurrent nightly runs
          # or the regular monster-realm dev/e2e database.
          MR_SMOKE_DB: monster-realm-smoke-${{ github.run_id }}
        run: just smoke-republish
      - name: Dump SpacetimeDB logs on failure
        if: failure()
        run: cat /tmp/stdb-smoke.log || true

  # Changelog ledger-freshness drift check — ADR-0165's Accepted decision, finally
  # implemented in 13r-g (ADR-0196). Nightly and NOT per-PR by deliberate design: the
  # ledger is allowed to lag by up to one open milestone (ARCHITECTURE.md m17.5g), so a
  # per-PR gate would fire red on essentially every feature PR for a condition that PR did
  # not cause — the nag-then-bypass mode ADR-0165 rejected.
  # The job runs the checker's own test suite first, then the checker. It fails only on a
  # ledger that is BOTH far behind and behind for days (see the threshold provenance in
  # scripts/changelog-freshness.mjs); a healthy mid-milestone wave prints an advisory and
  # exits 0.
  # Failure policy for `changelog-freshness`: triaged and inserted as the next slice in
  # the milestone queue, same tier as fix-red-master, below it in ordering.
  changelog-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        # `fetch-depth: 0` is load-bearing, not hygiene: at the default depth 1 git-cliff
        # generates a ONE-entry changelog silently and exits 0, which would read as
        # "nothing missing" — a permanently green gate. The script asserts
        # `git rev-parse --is-shallow-repository` at runtime as well, so deleting this
        # line to speed the job up fails loudly instead of going quietly vacuous.
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        # No npm cache: the checker is node-stdlib-only and installs nothing.
        with: { node-version: '24.13.1' }
      # Pinned to the EXACT git-cliff that generated the committed CHANGELOG.md. An
      # unpinned `latest` would let an upstream rendering change flip every entry to
      # missing+extra at once and red this job for a reason unrelated to freshness.
      - uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2
        with: { tool: git-cliff@2.13.1 }
      # Two separate steps, never one `;`-joined line: a joined command would report only
      # the last exit status and silently discard the suite's result.
      #
      # The TAP pass-count assertion is the SEMANTIC half of the zero-test countermeasure.
      # `node --test <file>` exits 0 when a file defines no tests, and the checker's own
      # floor counts an `it(` STRING — which a block comment containing 60 of them
      # satisfies with zero real tests (demonstrated). Only the runner's own tally proves
      # tests actually executed.
      - name: Gating suite (with a pass-count floor)
        # `shell: bash` for the `-o pipefail` it brings: the default Linux shell is
        # `bash -e` WITHOUT pipefail, so `node --test | tee` would discard node's exit
        # status. The explicit pass/fail parse below is the belt; this is the suspenders.
        shell: bash
        run: |
          node --test --test-reporter=tap scripts/changelog-freshness.test.mjs | tee /tmp/changelog-freshness.tap
          pass=$(sed -n 's/^# pass \([0-9]*\)$/\1/p' /tmp/changelog-freshness.tap | tail -n 1)
          fail=$(sed -n 's/^# fail \([0-9]*\)$/\1/p' /tmp/changelog-freshness.tap | tail -n 1)
          echo "changelog-freshness suite: pass=$pass fail=$fail"
          if [ -z "$pass" ] || [ "$pass" -lt 50 ] || [ "$fail" != "0" ]; then
            echo "changelog-freshness: suite reported pass=$pass fail=$fail — floor is 50 passing, 0 failing" >&2
            exit 1
          fi
      - run: node scripts/changelog-freshness.mjs --check
