name: CI
on:
  push: { branches: [master] }
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Dev and test builds carry line tables only; panics and backtraces keep file:line. Local
  # builds keep full debuginfo.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
jobs:
  # The four jobs below run every recipe of the justfile `ci:` recipe between them, one recipe
  # per step, grouped by toolchain. Each job has its own checkout and rust-cache prefix, so
  # the two writers of client-wasm/pkg (`just eval`: nodejs target, `just wasm`: bundler
  # target) never share a directory. Jobs that need the pkg build it themselves: a client test
  # requires it to be newer than the checked-out sources.
  rust:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 so gitleaks can diff the PR commit range.
      - uses: actions/checkout@v6 # v6
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Best-effort (needs the repo's dependency graph); cargo audit below is the blocking SCA gate.
      - name: Dependency review (SCA on PRs)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
      - uses: dtolnay/rust-toolchain@stable # stable
        with: { components: clippy, rustfmt }
      - uses: Swatinem/rust-cache@v2 # v2
        with: { prefix-key: v1-rust }
      - uses: actions/setup-node@v7 # v7
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with: { just-version: '1.58.0' }
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with: { tool: cargo-nextest@0.9.148 }
      # `just lint` runs biome from client/node_modules; `just test` runs the node:test doors.
      - run: just setup
      - run: just lint
      - run: just typecheck
      - run: just test
      - run: just security
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with: { tool: cargo-audit@0.22.2 }
      - name: SCA (cargo audit)
        run: cargo audit --file Cargo.lock

  eval:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: the schema and type snapshot evals compare against the baseline at
      # merge-base(HEAD, origin/master) and fail when git cannot resolve it.
      - uses: actions/checkout@v6 # v6
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable # stable
        with: { components: clippy, targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2 # v2
        with: { prefix-key: v1-eval }
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with: { version: 'v0.15.0' }
      - uses: actions/setup-node@v7 # v7
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with: { just-version: '1.58.0' }
      # The account-e2e driver resolves the SDK from client/node_modules.
      - run: just setup
      # Pinned spacetime CLI: with `CI` set, the bindings-drift and account-e2e evals fail
      # without it; they run a real `spacetime generate` and a live host.
      # `--yes`: the installer aborts on a non-tty runner without it.
      - name: Install SpacetimeDB CLI
        run: |
          curl -sSf -o /tmp/spacetime-install.sh https://install.spacetimedb.com
          sh /tmp/spacetime-install.sh --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Pin spacetime 2.11.0
        run: |
          spacetime version install 2.11.0
          spacetime version use 2.11.0
          spacetime --version
      - run: just eval

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # v6
      - uses: dtolnay/rust-toolchain@stable # stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2 # v2
        with: { prefix-key: v1-client }
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with: { version: 'v0.15.0' }
      - uses: actions/setup-node@v7 # v7
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with: { just-version: '1.58.0' }
      - run: just setup
      - run: just wasm
      - run: just client-typecheck
      - run: just client-test
      # --no-deps: the `just wasm` step above built the pkg this recipe depends on.
      - run: just --no-deps client-verify-build

  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # v6
      - uses: actions/setup-node@v7 # v7
        with: { node-version: '24.22.0' }
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with: { just-version: '1.58.0' }
      - run: just observability-validate

  # Two-window Playwright e2e against a real, version-pinned SpacetimeDB. The suite is split
  # with Playwright's `--shard`, one shard per runner: every spec file runs in exactly one
  # shard, and each shard has its own SpacetimeDB, so a file still shares its world only with
  # the files of its own shard. The total is `strategy.job-total`, so adding a matrix entry
  # is the whole change. `fail-fast: false`: one red shard never hides another's result.
  e2e-shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v6 # v6
      - uses: dtolnay/rust-toolchain@stable # stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2 # v2
        with: { prefix-key: v1-e2e }
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with: { version: 'v0.15.0' }
      - uses: actions/setup-node@v7 # v7
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with: { just-version: '1.58.0' }
      - name: Install SpacetimeDB CLI
        run: |
          curl -sSf -o /tmp/spacetime-install.sh https://install.spacetimedb.com
          sh /tmp/spacetime-install.sh --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Pin spacetime 2.11.0
        run: |
          spacetime version install 2.11.0
          spacetime version use 2.11.0
          spacetime --version
      # The e2e suite needs the dev_reducers build; `publish` has no feature passthrough, so
      # global-setup publishes this prebuilt artifact via --bin-path. The committed
      # bindings are NOT regenerated from it.
      - name: Build dev_reducers module wasm
        run: cargo build -p monster-realm-module --release --target wasm32-unknown-unknown --features dev_reducers
      - name: Start SpacetimeDB
        run: nohup spacetime start --in-memory --listen-addr 127.0.0.1:3000 > /tmp/stdb.log 2>&1 &
      - name: Wait for SpacetimeDB
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:3000/; then echo "ready after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "spacetime did not become ready on :3000" >&2; cat /tmp/stdb.log >&2 || true; exit 1
      - name: Install client deps
        run: cd client && npm ci
      # Browser binaries only, no `--with-deps`, so this job needs no Ubuntu apt mirror. The
      # runner image supplies every shared library chromium loads and the fonts every glyph
      # the client renders resolves to (DejaVu, Liberation, Noto Color Emoji). The fallback
      # fonts `--with-deps` would fetch through apt (CJK, Thai, FreeFont, Unifont, X11) are
      # unused; a spec that needs one bundles it as a web font instead of adding an apt step.
      - name: Install Playwright chromium
        run: cd client && npx playwright install chromium
      - name: Two-window e2e (golden flows vs real spacetime)
        env:
          STDB_SERVER: http://127.0.0.1:3000
          VITE_STDB_URI: ws://127.0.0.1:3000
          VITE_STDB_DB: monster-realm
          MR_DEV_MODULE_WASM: ${{ github.workspace }}/target/wasm32-unknown-unknown/release/monster_realm_module.wasm
        run: just e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      # The whole suite's test list, for the `e2e` job to compare the shards' union against.
      # Taken here because this runner already has everything the spec files import.
      - name: List the whole suite
        if: always()
        run: |
          cd client && mkdir -p test-results
          npx playwright test --list --reporter=json > test-results/e2e-list.json
      - name: Upload e2e per-test timings and the suite list
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-timings-${{ matrix.shard }}
          path: |
            client/test-results/e2e.json
            client/test-results/e2e-list.json
          if-no-files-found: warn
          retention-days: 14

  # Green only when the shards together ran every listed test exactly once with no failure:
  # an empty shard, a missing shard or a shard total above the number of shard jobs fails here.
  e2e:
    needs: [e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: e2e-timings-*
          path: e2e-shards
      - run: node scripts/e2e-shard-union.mjs e2e-shards
